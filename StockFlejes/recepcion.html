<title>Recepción Insumos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f6f8;padding:12px}
  .card{max-width:640px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
  .header{background:#1a1a1a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:24px;font-weight:700;letter-spacing:.3px}
  .header button{background:#fff;color:#111;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:18px}

  .steps{padding:14px 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  label.lbl{font-weight:800;font-size:20px;min-width:80px}
  select,input[type="text"]{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px}
  select{min-width:160px}
  input[type="text"]{width:160px}

  .btn{padding:10px 16px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:20px}
  .btn-primary{background:#111;color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:#fff;border:2px solid #d0d7de;color:#111}

  .status{margin:8px 0;font-size:20px;padding:6px 0}
  .ok{color:#0a7a2f}
  .bad{color:#b42318}

  .grid{display:grid;grid-template-columns:100px 80px minmax(180px,1fr);gap:8px;align-items:center}
  .grid .h{font-weight:900;font-size:18px;color:#333}
  .grid input[data-role="cant"]{width:100%;text-align:center;height:38px;border:2px solid #d0d7de;border-radius:8px;font-size:23px;font-weight:700}
  .grid input[data-role="cant"].has-val{border-color:#0a7a2f;background:#f3fbf6}
  .codeRO{background:#f6f8fa;width:100%;text-align:left;letter-spacing:0}
  .descCell{font-size:18px;color:#333;line-height:1.25;word-break:break-word}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
  .overlay.open{display:flex}
  .modal{width:min(720px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .modal-title{font-weight:900}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .hint{font-size:17px;color:#666;margin-top:6px}

  .successBox{display:none;margin:12px 0;border:2px solid #c7e8d1;background:#f3fbf6;border-radius:12px;padding:16px;text-align:center}
  .successBox .title{font-weight:900;font-size:23px;margin-bottom:4px}

  .remito-row{margin:10px 0}
  .remito-row input{width:200px}

  .hidden{display:none}
  .provs-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .prov-btn{padding:8px 14px;border-radius:8px;border:2px solid #d0d7de;background:#fff;font-weight:700;cursor:pointer;font-size:20px}
  .prov-btn.active{background:#111;color:#fff;border-color:#111}

  .search-box{margin:12px 0;padding:12px;background:#f6f8fa;border-radius:8px}
  .search-box input{width:100%;padding:10px;font-size:18px;border:2px solid #d0d7de;border-radius:6px}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
  .item-btn{padding:12px;background:#fff;border:2px solid #d0d7de;border-radius:8px;cursor:pointer;text-align:center;font-weight:600;font-size:16px;transition:all .2s}
  .item-btn:hover{border-color:#111;background:#f6f8fa}
  .item-btn.active{background:#111;color:#fff;border-color:#111}
  .item-btn .code{display:block;font-size:14px;font-weight:700;color:#0066cc}
  .item-btn .isis{display:block;font-size:12px;color:#666;margin-top:4px}
  .item-btn .medida{display:block;font-size:13px;color:#999;margin-top:2px}

  .input-kg-popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
  .input-kg-popup.open{display:flex}
  .kg-modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .kg-modal h3{margin-bottom:16px;font-size:22px;font-weight:700}
  .kg-modal .item-info{background:#f6f8fa;padding:12px;border-radius:6px;margin-bottom:16px;font-size:16px}
  .kg-modal input{width:100%;padding:12px;font-size:20px;border:2px solid #d0d7de;border-radius:6px;margin-bottom:16px;text-align:center}
  .kg-modal .actions{display:flex;gap:8px}
  .kg-modal button{flex:1;padding:12px;font-size:18px;font-weight:700;border:none;border-radius:6px;cursor:pointer}

  /* Modal de flejes con grupos de rollos */
  .rollos-modal{background:#fff;border-radius:12px;padding:24px;width:90%;max-width:600px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:85vh;overflow-y:auto}
  .rollos-modal h3{margin-bottom:16px;font-size:22px;font-weight:700}
  .rollos-modal .item-info{background:#f6f8fa;padding:12px;border-radius:6px;margin-bottom:20px;font-size:16px}
  .rollos-tabla{width:100%;border-collapse:collapse;margin-bottom:20px}
  .rollos-tabla th,.rollos-tabla td{padding:12px;border:1px solid #d0d7de;text-align:center;font-size:16px}
  .rollos-tabla th{background:#f6f8fa;font-weight:700;font-size:15px}
  .rollos-tabla input{width:100%;padding:8px;font-size:18px;border:2px solid #d0d7de;border-radius:6px;text-align:center;font-weight:600}
  .rollos-tabla .total-row{background:#f0f0f0;font-weight:700;font-size:17px}
  .rollos-tabla .total-row td{border-top:2px solid #333;border-bottom:2px solid #333}
  .btn-remove-grupo{background:#b42318;color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:14px;font-weight:700}
  .btn-remove-grupo:hover{background:#8b1a13}
  .btn-add-grupo{background:#0a7a2f;color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700;margin-bottom:16px;width:100%}
  .btn-add-grupo:hover{background:#067a28}
  .rollos-actions{display:flex;gap:8px;margin-top:20px}
  .rollos-actions button{flex:1;padding:12px;font-size:18px;font-weight:700;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Recepción Insumos</h1>
    <button onclick="gpHome()">Atrás</button>
  </div>
  <script>
    function gpHome(){
      var r = sessionStorage.getItem('gp_role') || 'admin';
      window.location.href = (r === 'envios') ? '../envios-only.html' : '../Inicio/index.html';
    }
  </script>

  <div class="steps">
    <!-- Paso 1: Rubro -->
    <div id="step1">
      <div class="row">
        <label class="lbl">Rubro</label>
      </div>
      <div class="provs-grid" id="rubroGrid">
        <button class="prov-btn" data-rubro="Flejes">Flejes</button>
        <button class="prov-btn" data-rubro="Cajas">Cajas</button>
        <button class="prov-btn" data-rubro="Plasticos">Plásticos</button>
        <button class="prov-btn" data-rubro="Cartones">Cartones</button>
        <button class="prov-btn" data-rubro="Remaches">Remaches</button>
        <button class="prov-btn" data-rubro="Bombillas">Bombillas</button>
      </div>

      <!-- Paso 2: Proveedor -->
      <div id="provSection" class="hidden">
        <div class="row">
          <label class="lbl">Proveedor</label>
        </div>
        <div class="provs-grid" id="provGrid"></div>
      </div>

      <!-- Remito -->
      <div id="remitoSection" class="hidden remito-row">
        <div class="row">
          <label class="lbl">N° Remito</label>
          <input type="text" id="txtRemito" placeholder="Opcional">
        </div>
      </div>

      <div class="row" id="btnContinuarRow" class="hidden" style="display:none">
        <button id="btnContinuar" class="btn btn-primary" disabled>Cargar artículos</button>
      </div>
    </div>

    <div id="statusMsg" class="status"></div>
    <div id="successBox" class="successBox">
      <div class="title">Recepción registrada</div>
      <div id="successDetail"></div>
      <br>
      <button class="btn btn-primary" onclick="location.reload()">Nueva recepción</button>
    </div>
  </div>
</div>

<!-- Modal artículos -->
<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modal-header" style="display:flex;align-items:center;gap:10px">
      <div class="modal-title" id="modalTitle" style="flex:1">Artículos</div>
      <button id="sendModal" class="btn btn-primary">Registrar</button>
      <button class="btn btn-secondary" id="closeModal">✕</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por código, medida o ISIS..." />
    </div>

    <div id="lines" class="items-grid"></div>

    <div class="hint">Selecciona los artículos y anota la cantidad en kg.</div>
    <div class="modal-actions">
      <button id="cancelModal" class="btn btn-secondary">Cancelar</button>
    </div>
    <div id="modalMsg" class="status"></div>
  </div>
</div>

<!-- Modal para ingresar kg (todos rubros) -->
<div id="inputKgPopup" class="input-kg-popup">
  <div class="kg-modal" id="kgModalContainer">
    <h3>Cantidad en KG</h3>
    <div class="item-info" id="kgItemInfo"></div>
    <input type="text" id="inputKgValue" inputmode="decimal" placeholder="0,0" />
    <div class="actions">
      <button class="btn btn-secondary" id="kgCancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="kgConfirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal para flejes con grupos de rollos -->
<div id="inputRollosPopup" class="input-kg-popup">
  <div class="rollos-modal">
    <h3>Carga de Rollos</h3>
    <div class="item-info" id="rollosItemInfo"></div>
    <button class="btn-add-grupo" id="btnAddGrupo">+ Agregar grupo de rollo</button>
    <table class="rollos-tabla">
      <thead>
        <tr>
          <th style="width:15%">Rollo</th>
          <th style="width:30%">Cant</th>
          <th style="width:30%">Kg c/u</th>
          <th style="width:20%">Total Kg</th>
          <th style="width:5%"></th>
        </tr>
      </thead>
      <tbody id="rollosBody"></tbody>
    </table>
    <div class="rollos-tabla" style="margin-top:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:18px;font-weight:700">
        <div>Kg TOTAL: <span id="totalKgFinal">0</span></div>
        <div>Rollos TOTAL: <span id="totalRollosFinal">0</span></div>
      </div>
    </div>
    <div class="rollos-actions">
      <button class="btn btn-secondary" id="rollosCancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="rollosConfirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Proveedores por rubro
const PROVEEDORES = {
  Flejes: ["Basconia","Aperam","Hermac","Brawin","Altrak","Szapiro","EstaMetal","JL Metales","Alami"],
  Cajas: ["Corrugadora"],
  Plasticos: ["Pat Bet Plast","Rodar","Telleria","Maspoli","Pintos","Martin Faccolo","JL Matriceria","Capuchon Mariposa","Base Afila","M. Pelador","Terrero","Mangos Abrelata","Regatones","Bujes Abrelatas","Mango Ergon.","Mangos NM","Packaging y Serv","Sesega","Barbeja"],
  Cartones: ["Grafica Pol"],
  Remaches: ["Bella Vista","Dilmax","Electronica Mandelli","Imel"],
  Bombillas: ["Por definir"]
};

// Unidad por rubro (default) + excepciones por proveedor
// Tipos: "Kg" (decimal), "Uni" (entero), "Millares" (entero), "Litros" (decimal), "Cajas" (entero)
const UNIDADES = {
  Flejes:    { _default: "Kg" },
  Cajas:     { _default: "Cajas" },
  Cartones:  { _default: "Uni" },
  Plasticos: { _default: "Uni", "Martin Faccolo": "Kg", "Sesega": "Kg", "Barbeja": "Uni" },
  Remaches:  { _default: "Millares", "Dilmax": "Litros" },
  Bombillas: { _default: "Uni" }
};

function getUnidad(rubro, prov) {
  const cfg = UNIDADES[rubro] || {};
  return cfg[prov] || cfg._default || "Uni";
}

function esDecimal(unidad) {
  return unidad === "Kg" || unidad === "Litros";
}

// Tablas fuente por rubro
const TABLAS = {
  Flejes:    { tabla: "Flejes",           colCod: "N Fleje",  colDesc: "Descripción", colIsis: "Cod_ISIS", colMedida: "Medida mm", colProv: "Proveedor" },
  Cajas:     { tabla: "Cajas",            colCod: "N_Caja",   colDesc: "Cod_ISIS_LK",          colProv: null },
  Plasticos: { tabla: "Partes_Plasticas", colCod: "Cod_ISIS", colDesc: "Descripcion",          colProv: "Proveedor" },
  Cartones:  { tabla: "Despiece x Articulo", colCod: "COD",  colDesc: "Descripcion de partes", colProv: null, filtro: { col: "Rubro", val: "Cartones" } },
  // Remaches: especial - une Remaches SC + Remaches SP. Manejado por separado en cargarRemaches().
  Remaches:  { especial: "remaches" },
  Bombillas: { tabla: "Bombillas",        colCod: "Sector",   colDesc: "Descripcion",          colProv: "Proveedor" }
};

let rubroSel = "";
let provSel = "";
let items = [];
let filteredItems = [];
let selectedItem = null;
let selectedItemIdx = -1;

const rubroGrid = document.getElementById("rubroGrid");
const provSection = document.getElementById("provSection");
const provGrid = document.getElementById("provGrid");
const remitoSection = document.getElementById("remitoSection");
const btnContinuarRow = document.getElementById("btnContinuarRow");
const btnContinuar = document.getElementById("btnContinuar");
const statusMsg = document.getElementById("statusMsg");
const successBox = document.getElementById("successBox");
const successDetail = document.getElementById("successDetail");
const overlay = document.getElementById("overlay");
const linesWrap = document.getElementById("lines");
const modalTitle = document.getElementById("modalTitle");
const modalMsg = document.getElementById("modalMsg");
const txtRemito = document.getElementById("txtRemito");
const searchInput = document.getElementById("searchInput");
const inputKgPopup = document.getElementById("inputKgPopup");
const kgItemInfo = document.getElementById("kgItemInfo");
const inputKgValue = document.getElementById("inputKgValue");
const kgConfirmBtn = document.getElementById("kgConfirmBtn");
const kgCancelBtn = document.getElementById("kgCancelBtn");

function esc(s) { return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function arDateISO() {
  return new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}

// ===== Rubro =====
rubroGrid.querySelectorAll(".prov-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    rubroSel = btn.dataset.rubro;
    rubroGrid.querySelectorAll(".prov-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    items = [];
    filteredItems = [];
    renderProveedores();
  });
});

function renderProveedores() {
  const provs = PROVEEDORES[rubroSel] || [];
  provGrid.innerHTML = "";
  provSel = "";

  if (provs.length === 1) {
    provSel = provs[0];
    provSection.classList.add("hidden");
  } else {
    provs.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "prov-btn";
      btn.textContent = p;
      btn.addEventListener("click", () => {
        provSel = p;
        provGrid.querySelectorAll(".prov-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        updateReady();
      });
      provGrid.appendChild(btn);
    });
    provSection.classList.remove("hidden");
  }

  remitoSection.classList.remove("hidden");
  updateReady();
}

function updateReady() {
  const ok = rubroSel && provSel;
  btnContinuar.disabled = !ok;
  btnContinuarRow.style.display = "";
}

// ===== Cargar artículos =====
btnContinuar.addEventListener("click", async () => {
  btnContinuar.disabled = true;
  statusMsg.textContent = "Cargando artículos...";
  statusMsg.className = "status";

  try {
    const cfg = TABLAS[rubroSel];
    let data, error;

    if (cfg.especial === "remaches") {
      // Remaches: une Remaches SC + Remaches SP filtrando por proveedor
      const [scRes, spRes] = await Promise.all([
        sb.from("Remaches SC").select("*").eq("Proveedor", provSel),
        sb.from("Remaches SP").select("*").eq("Proveedor", provSel)
      ]);
      if (scRes.error) throw scRes.error;
      if (spRes.error) throw spRes.error;
      const scRows = (scRes.data || []).map(r => ({ cod: r["SC"], desc: r["Descripción"], isis: "", medida: "" }));
      const spRows = (spRes.data || []).map(r => ({ cod: r["SP"], desc: r["Descripción"], isis: "", medida: "" }));
      data = [...scRows, ...spRows];
      data.sort((a,b) => String(a.cod).localeCompare(String(b.cod), "es"));
    } else {
      let query = sb.from(cfg.tabla).select("*");
      if (cfg.colProv && provSel) query = query.eq(cfg.colProv, provSel);
      if (cfg.filtro) query = query.eq(cfg.filtro.col, cfg.filtro.val);
      const res = await query.order(cfg.colCod, { ascending: true });
      if (res.error) throw res.error;
      data = (res.data || []).map(r => ({
        cod: String(r[cfg.colCod] ?? "").trim(),
        desc: String(r[cfg.colDesc] ?? "").trim(),
        isis: cfg.colIsis ? String(r[cfg.colIsis] ?? "").trim() : "",
        medida: cfg.colMedida ? String(r[cfg.colMedida] ?? "").trim() : "",
        rowData: r
      }));
    }

    const seen = new Set();
    items = data.filter(r => {
      const cod = String(r.cod ?? "").trim();
      if (!cod || seen.has(cod)) return false;
      seen.add(cod);
      return true;
    }).map(r => {
      const item = {
        codigo: String(r.cod).trim(),
        descripcion: String(r.desc ?? "").trim(),
        isis: String(r.isis ?? "").trim(),
        medida: String(r.medida ?? "").trim(),
        _cant: "",
        rowData: r.rowData || {}
      };
      if (rubroSel === "Flejes") {
        // Para flejes, inicializar con un grupo vacío
        item._rollos = [{ rollos: "", kg: "" }];
      }
      return item;
    });

    if (!items.length) {
      statusMsg.textContent = "No hay artículos para este proveedor.";
      statusMsg.className = "status bad";
      btnContinuar.disabled = false;
      return;
    }

    statusMsg.textContent = "";
    modalTitle.textContent = `${provSel} — ${items.length} artículos`;
    buildModal();
    overlay.classList.add("open");

  } catch (err) {
    console.error(err);
    statusMsg.textContent = "Error: " + err.message;
    statusMsg.className = "status bad";
    btnContinuar.disabled = false;
  }
});

// ===== Modal =====
function renderItems() {
  linesWrap.innerHTML = "";
  filteredItems.forEach((item, i) => {
    const btn = document.createElement("button");
    const hasData = rubroSel === "Flejes" ? (item._rollos && item._rollos.length > 0) : item._cant;
    btn.className = "item-btn" + (hasData ? " active" : "");

    btn.innerHTML = `<div class="code">${esc(item.codigo)}</div>`;

    if (item.isis) {
      btn.innerHTML += `<div class="isis">ISIS: ${esc(item.isis)}</div>`;
    }

    if (item.medida) {
      btn.innerHTML += `<div class="medida" style="font-weight:600;color:#111;margin-top:4px">${esc(item.medida)}</div>`;
    }

    if (hasData && rubroSel === "Flejes") {
      const totalRollos = (item._rollos || []).reduce((s, g) => s + (Number(g.rollos) || 0), 0);
      const totalKg = (item._rollos || []).reduce((s, g) => s + (Number(g.rollos) || 0) * (Number(g.kg) || 0), 0);
      btn.innerHTML += `<div style="color:#0a7a2f;font-weight:700;margin-top:6px;font-size:14px">${totalRollos} rollos · ${totalKg.toFixed(1)} kg</div>`;
    }

    btn.addEventListener("click", () => openKgPopup(item, i));
    linesWrap.appendChild(btn);
  });
}

function filterItems() {
  const q = searchInput.value.toLowerCase();
  filteredItems = items.filter(it => {
    const text = (it.codigo + " " + it.descripcion + " " + it.isis + " " + it.medida).toLowerCase();
    return text.includes(q);
  });
  renderItems();
}

function buildModal() {
  linesWrap.innerHTML = "";
  modalMsg.textContent = "";
  searchInput.value = "";
  filteredItems = [...items];

  searchInput.addEventListener("input", filterItems);
  renderItems();
  setTimeout(() => searchInput.focus(), 100);
}

function openKgPopup(item, idx) {
  selectedItem = item;
  selectedItemIdx = idx;

  if (rubroSel === "Flejes") {
    // Modal de flejes con grupos de rollos
    document.getElementById("rollosItemInfo").innerHTML = `<strong>${esc(item.codigo)}</strong> - ${esc(item.descripcion)}`;
    if (item.isis) document.getElementById("rollosItemInfo").innerHTML += ` <br><small>ISIS: ${esc(item.isis)}</small>`;
    if (item.medida) document.getElementById("rollosItemInfo").innerHTML += ` <br><small>Medida: ${esc(item.medida)}</small>`;

    renderRollosTabla();
    document.getElementById("inputRollosPopup").classList.add("open");
  } else {
    // Modal simple para otros rubros
    kgItemInfo.innerHTML = `<strong>${esc(item.codigo)}</strong> - ${esc(item.descripcion)}`;
    if (item.isis) kgItemInfo.innerHTML += ` <br><small>ISIS: ${esc(item.isis)}</small>`;
    inputKgValue.value = item._cant || "";
    document.getElementById("inputKgPopup").classList.add("open");
    setTimeout(() => inputKgValue.focus(), 100);
  }
}

function closeKgPopup() {
  document.getElementById("inputKgPopup").classList.remove("open");
  document.getElementById("inputRollosPopup").classList.remove("open");
  selectedItem = null;
  selectedItemIdx = -1;
}

// ===== Manejo de Flejes con grupos de rollos =====
function renderRollosTabla() {
  const item = selectedItem;
  if (!item || !item._rollos) return;

  const tbody = document.getElementById("rollosBody");
  tbody.innerHTML = "";

  item._rollos.forEach((grupo, i) => {
    const tr = document.createElement("tr");
    const totalKgGrupo = (Number(grupo.rollos) || 0) * (Number(grupo.kg) || 0);

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><input type="number" class="inp-rollos" value="${grupo.rollos || ""}" min="0" step="1" data-idx="${i}"></td>
      <td><input type="number" class="inp-kg" value="${grupo.kg || ""}" min="0" step="0.01" data-idx="${i}"></td>
      <td>${totalKgGrupo.toFixed(2)}</td>
      <td>${i === 0 ? "" : `<button class="btn-remove-grupo" data-idx="${i}">✕</button>`}</td>
    `;
    tbody.appendChild(tr);
  });

  // Listeners para inputs
  document.querySelectorAll(".inp-rollos, .inp-kg").forEach(inp => {
    inp.addEventListener("input", actualizarRollosTabla);
  });

  // Listeners para botones remove
  document.querySelectorAll(".btn-remove-grupo").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const idx = Number(e.target.dataset.idx);
      if (selectedItem._rollos[idx]) {
        selectedItem._rollos.splice(idx, 1);
        renderRollosTabla();
      }
    });
  });

  actualizarRollosTabla();
}

function actualizarRollosTabla() {
  const item = selectedItem;
  if (!item || !item._rollos) return;

  // Guardar valores de inputs
  document.querySelectorAll(".inp-rollos").forEach(inp => {
    const idx = Number(inp.dataset.idx);
    item._rollos[idx].rollos = inp.value ? Number(inp.value) : 0;
  });

  document.querySelectorAll(".inp-kg").forEach(inp => {
    const idx = Number(inp.dataset.idx);
    item._rollos[idx].kg = inp.value ? parseFloat(inp.value) : 0;
  });

  // Calcular totales
  let totalRollos = 0;
  let totalKg = 0;
  item._rollos.forEach(grupo => {
    totalRollos += Number(grupo.rollos) || 0;
    totalKg += (Number(grupo.rollos) || 0) * (Number(grupo.kg) || 0);
  });

  document.getElementById("totalRollosFinal").textContent = totalRollos;
  document.getElementById("totalKgFinal").textContent = totalKg.toFixed(2);
}

function closeModalFn() {
  overlay.classList.remove("open");
  btnContinuar.disabled = false;
  searchInput.removeEventListener("input", filterItems);
}

document.getElementById("closeModal").onclick = closeModalFn;
document.getElementById("cancelModal").onclick = closeModalFn;
overlay.addEventListener("click", e => { if (e.target === overlay) closeModalFn(); });

// Manejo del popup de kg
inputKgValue.addEventListener("input", () => {
  inputKgValue.value = inputKgValue.value.replace(/[^0-9.,]/g, "").replace(/([.,].*)[.,]/g, "$1");
});

inputKgValue.addEventListener("keydown", e => {
  if (e.key === "Enter") kgConfirmBtn.click();
});

kgConfirmBtn.addEventListener("click", () => {
  if (!selectedItem) return;
  const val = inputKgValue.value.trim();
  if (val && Number(val.replace(",", ".")) > 0) {
    selectedItem._cant = val;
    renderItems();
  }
  closeKgPopup();
});

kgCancelBtn.addEventListener("click", closeKgPopup);

document.getElementById("inputKgPopup").addEventListener("click", e => {
  if (e.target === document.getElementById("inputKgPopup")) closeKgPopup();
});

// Botones de flejes
document.getElementById("btnAddGrupo").addEventListener("click", () => {
  if (!selectedItem || !selectedItem._rollos) return;
  selectedItem._rollos.push({ rollos: "", kg: "" });
  renderRollosTabla();
});

document.getElementById("rollosCancelBtn").addEventListener("click", closeKgPopup);

document.getElementById("rollosConfirmBtn").addEventListener("click", () => {
  if (!selectedItem || !selectedItem._rollos) return;

  // Guardar valores finales
  actualizarRollosTabla();

  // Validar que haya al menos un grupo con datos
  const tieneData = selectedItem._rollos.some(g => (Number(g.rollos) || 0) > 0 && (Number(g.kg) || 0) > 0);
  if (!tieneData) {
    alert("Completá al menos un grupo de rollos con cantidad y peso.");
    return;
  }

  renderItems();
  closeKgPopup();
});

document.getElementById("inputRollosPopup").addEventListener("click", e => {
  if (e.target === document.getElementById("inputRollosPopup")) closeKgPopup();
});

// ===== Enviar =====
document.getElementById("sendModal").addEventListener("click", async () => {
  const unidad = getUnidad(rubroSel, provSel);
  const parseCant = (s) => Number(String(s || "").replace(",", ".")) || 0;

  // Filtrar items que tengan datos (según el rubro)
  let toSend;
  if (rubroSel === "Flejes") {
    toSend = items.filter(it => it._rollos && it._rollos.length > 0 && it._rollos.some(g => (Number(g.rollos) || 0) > 0));
  } else {
    toSend = items.filter(it => parseCant(it._cant) > 0);
  }

  if (!toSend.length) {
    modalMsg.textContent = rubroSel === "Flejes" ? "Completá al menos un artículo con rollos." : "Completá al menos una cantidad.";
    modalMsg.className = "status bad";
    return;
  }

  // Resumen
  let resumen;
  if (rubroSel === "Flejes") {
    resumen = toSend.map(it => {
      const totalRollos = it._rollos.reduce((s, g) => s + (Number(g.rollos) || 0), 0);
      const totalKg = it._rollos.reduce((s, g) => s + (Number(g.rollos) || 0) * (Number(g.kg) || 0), 0);
      return `${it.codigo}: ${totalRollos} rollos · ${totalKg.toFixed(1)} kg`;
    }).join("\n");
  } else {
    resumen = toSend.map(it => `${it.codigo}: ${it._cant} ${unidad}`).join("\n");
  }

  if (!confirm(`Registrar recepción de ${provSel}?\n\n${resumen}`)) return;

  const sendBtn = document.getElementById("sendModal");
  sendBtn.disabled = true;
  modalMsg.textContent = "Guardando...";
  modalMsg.className = "status";

  try {
    const remito = txtRemito.value.trim();
    const registros = [];

    toSend.forEach(it => {
      if (rubroSel === "Flejes") {
        // Para flejes, crear un registro por grupo de rollo
        it._rollos.forEach(grupo => {
          if (Number(grupo.rollos) > 0) {
            registros.push({
              fecha: arDateISO(),
              proveedor: provSel,
              rubro: rubroSel,
              codigo: it.codigo,
              descripcion: it.descripcion,
              cantidad: (Number(grupo.rollos) || 0) * (Number(grupo.kg) || 0),
              unidad: "Kg",
              remito: remito || null,
              rollos: Number(grupo.rollos) || 0,
              peso_x_rollo: Number(grupo.kg) || 0,
              medida: it.medida || null
            });
          }
        });
      } else {
        // Para otros rubros, un registro por item
        registros.push({
          fecha: arDateISO(),
          proveedor: provSel,
          rubro: rubroSel,
          codigo: it.codigo,
          descripcion: it.descripcion,
          cantidad: parseCant(it._cant),
          unidad: unidad,
          remito: remito || null,
          medida: it.medida || null
        });
      }
    });

    const { data, error } = await sb.from("Recepcion_Insumos").insert(registros).select();
    if (error) throw error;
    if (!data || data.length === 0) {
      modalMsg.textContent = "No se registró ningún artículo. Sesión expirada? Reingresá con Google.";
      modalMsg.className = "status bad";
      sendBtn.disabled = false;
      return;
    }

    overlay.classList.remove("open");
    successDetail.textContent = `${data.length} artículo(s) de ${provSel} · Remito: ${remito || "—"}`;
    successBox.style.display = "block";
    statusMsg.textContent = "";

  } catch (err) {
    console.error(err);
    modalMsg.textContent = "Error: " + err.message;
    modalMsg.className = "status bad";
    sendBtn.disabled = false;
  }
});
</script>

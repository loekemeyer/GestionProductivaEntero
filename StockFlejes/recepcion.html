<!doctype html>
<html lang="es">
<head>
<script src="../auth-guard.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recepción Insumos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f6f8;padding:12px}
  .card{max-width:640px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
  .header{background:#1a1a1a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:24px;font-weight:700;letter-spacing:.3px}
  .header button{background:#fff;color:#111;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:18px}

  .steps{padding:14px 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
  label.lbl{font-weight:800;font-size:20px;min-width:80px}
  select,input[type="text"]{height:40px;border:2px solid #d0d7de;border-radius:8px;padding:0 10px;font-size:21px}
  select{min-width:160px}
  input[type="text"]{width:160px}

  .btn{padding:10px 16px;border-radius:8px;border:none;font-weight:800;cursor:pointer;font-size:20px}
  .btn-primary{background:#111;color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:#fff;border:2px solid #d0d7de;color:#111}

  .status{margin:8px 0;font-size:20px;padding:6px 0}
  .ok{color:#0a7a2f}
  .bad{color:#b42318}

  .grid{display:grid;grid-template-columns:100px 80px minmax(180px,1fr);gap:8px;align-items:center}
  .grid .h{font-weight:900;font-size:18px;color:#333}
  .grid input[data-role="cant"]{width:100%;text-align:center;height:38px;border:2px solid #d0d7de;border-radius:8px;font-size:23px;font-weight:700}
  .grid input[data-role="cant"].has-val{border-color:#0a7a2f;background:#f3fbf6}
  .codeRO{background:#f6f8fa;width:100%;text-align:left;letter-spacing:0}
  .descCell{font-size:18px;color:#333;line-height:1.25;word-break:break-word}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
  .overlay.open{display:flex}
  .modal{width:min(720px,100%);max-height:90vh;overflow-y:auto;background:#fff;border-radius:14px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.2)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .modal-title{font-weight:900}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .hint{font-size:17px;color:#666;margin-top:6px}

  .successBox{display:none;margin:12px 0;border:2px solid #c7e8d1;background:#f3fbf6;border-radius:12px;padding:16px;text-align:center}
  .successBox .title{font-weight:900;font-size:23px;margin-bottom:4px}

  .remito-row{margin:10px 0}
  .remito-row input{width:200px}

  .hidden{display:none}
  .provs-grid{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .prov-btn{padding:8px 14px;border-radius:8px;border:2px solid #d0d7de;background:#fff;font-weight:700;cursor:pointer;font-size:20px}
  .prov-btn.active{background:#111;color:#fff;border-color:#111}

  .search-box{margin:12px 0;padding:12px;background:#f6f8fa;border-radius:8px}
  .search-box input{width:100%;padding:10px;font-size:18px;border:2px solid #d0d7de;border-radius:6px}
  /* Buscador de medida (flejes): 3 inputs a mm x b mm x c mm */
  #flejesSearch{display:none;align-items:center;flex-wrap:wrap;gap:6px;font-size:19px;font-weight:800}
  #flejesSearch .fm{flex:1;min-width:0;padding:8px 12px;text-align:center;border:2px solid #d0d7de;border-radius:6px;font-size:20px;font-weight:800}
  #flejesSearch .fm.on{border-color:#0a7a2f;background:#f3fbf6}
  #flejesSearch .x{background:#fff;border:2px solid #d0d7de;border-radius:6px;padding:8px 12px;font-weight:800;cursor:pointer}

  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
  .item-btn{padding:12px;background:#fff;border:2px solid #d0d7de;border-radius:8px;cursor:pointer;text-align:center;font-weight:600;font-size:16px;transition:all .2s}
  .item-btn:hover{border-color:#111;background:#f6f8fa}
  .item-btn.active{background:#111;color:#fff;border-color:#111}
  .item-btn .code{display:block;font-size:14px;font-weight:700;color:#0066cc}
  .item-btn .isis{display:block;font-size:12px;color:#666;margin-top:4px}
  .item-btn .medida{display:block;font-size:14px;font-weight:800;color:#333;margin-top:2px}

  .input-kg-popup{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200}
  .input-kg-popup.open{display:flex}
  .kg-modal{background:#fff;border-radius:16px;padding:38px;width:96%;max-width:700px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
  .kg-modal h3{margin-bottom:22px;font-size:36px;font-weight:700}
  .kg-modal .item-info{background:#f6f8fa;padding:18px;border-radius:10px;margin-bottom:22px;font-size:24px}
  .kg-modal input{width:100%;padding:16px;font-size:28px;border:2px solid #d0d7de;border-radius:8px;margin-bottom:20px;text-align:center}
  .kg-modal .actions{display:flex;gap:12px}
  .kg-modal button{flex:1;padding:18px;font-size:25px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
  /* Grilla de rollos por peso (flejes) */
  .rg-label{font-size:23px;font-weight:700;margin-bottom:12px}
  .rg-scroll{overflow-x:auto}
  table.rollos-grid{border-collapse:collapse;margin:0 auto}
  table.rollos-grid th{font-size:22px;font-weight:700;text-align:right;padding:7px 12px;color:#444;white-space:nowrap}
  table.rollos-grid td{padding:6px 6px;text-align:center;vertical-align:middle}
  table.rollos-grid input{width:104px;padding:14px 6px;font-size:28px;border:2px solid #d0d7de;border-radius:8px;margin:0;text-align:center}
  table.rollos-grid .rg-one{display:inline-block;min-width:104px;font-size:28px;font-weight:700}
  table.rollos-grid .rg-row-kgtot td{font-size:23px;font-weight:700;color:#1769aa}
  table.rollos-grid .rg-row-total th,table.rollos-grid .rg-row-total td{font-size:28px;font-weight:800;padding-top:14px}
  table.rollos-grid .rg-row-total td{text-align:center}
  .rg-rm{border:none;background:#f0d2d2;color:#b91c1c;border-radius:50%;width:30px;height:30px;font-size:19px;line-height:1;padding:0;cursor:pointer;margin-left:3px;flex:none}
  #rgPlus{border:none;background:#1769aa;color:#fff;border-radius:50%;width:50px;height:50px;font-size:32px;line-height:1;padding:0;cursor:pointer}
  .rg-estip{margin-top:12px;text-align:center;font-size:21px;font-weight:800}
  .rg-estip.rg-est-ok{color:#0a7a2f}
  .rg-estip.rg-est-bad{color:#b91c1c}
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Recepción Insumos</h1>
    <button onclick="gpHome()">Atrás</button>
  </div>
  <script>
    function gpHome(){
      var r = sessionStorage.getItem('gp_role') || 'admin';
      window.location.href = (r === 'envios') ? '../envios-only.html' : '../Inicio/index.html';
    }
  </script>

  <div class="steps">
    <!-- Paso 1: Rubro -->
    <div id="step1">
      <div class="row">
        <label class="lbl">Rubro</label>
      </div>
      <div class="provs-grid" id="rubroGrid">
        <button class="prov-btn" data-rubro="Flejes">Flejes</button>
        <button class="prov-btn" data-rubro="Cajas">Cajas</button>
        <button class="prov-btn" data-rubro="Plasticos">Plásticos</button>
        <button class="prov-btn" data-rubro="Cartones">Cartones</button>
        <button class="prov-btn" data-rubro="Remaches">Remaches</button>
        <button class="prov-btn" data-rubro="Bombillas">Bombillas</button>
      </div>

      <!-- Paso 2: Proveedor -->
      <div id="provSection" class="hidden">
        <div class="row">
          <label class="lbl">Proveedor</label>
        </div>
        <div class="provs-grid" id="provGrid"></div>
      </div>

      <!-- Remito -->
      <div id="remitoSection" class="hidden remito-row">
        <div class="row">
          <label class="lbl">N° Remito</label>
          <input type="text" id="txtRemito" placeholder="Opcional">
        </div>
      </div>

      <div class="row" id="btnContinuarRow" class="hidden" style="display:none">
        <button id="btnContinuar" class="btn btn-primary" disabled>Cargar artículos</button>
      </div>
    </div>

    <div id="statusMsg" class="status"></div>
    <div id="successBox" class="successBox">
      <div class="title">Recepción registrada</div>
      <div id="successDetail"></div>
      <br>
      <button class="btn btn-primary" onclick="location.reload()">Nueva recepción</button>
    </div>
  </div>
</div>

<!-- Modal artículos -->
<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modal-header" style="display:flex;align-items:center;gap:10px">
      <div class="modal-title" id="modalTitle" style="flex:1">Artículos</div>
      <button id="sendModal" class="btn btn-primary">Registrar</button>
      <button class="btn btn-secondary" id="closeModal">✕</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por código, medida o ISIS..." />
      <div id="flejesSearch">
        <span>Medida / N°:</span>
        <input class="fm" id="fm_a" type="text" placeholder="19 x 2,1   ·   o N° de fleje">
        <button class="x" id="fmClear" type="button">✕</button>
      </div>
    </div>

    <div id="lines" class="items-grid"></div>

    <div class="hint">Selecciona los artículos y anota la cantidad en kg.</div>
    <div class="modal-actions">
      <button id="cancelModal" class="btn btn-secondary">Cancelar</button>
    </div>
    <div id="modalMsg" class="status"></div>
  </div>
</div>

<!-- Modal para ingresar datos -->
<div id="inputKgPopup" class="input-kg-popup">
  <div class="kg-modal">
    <h3 id="kgModalTitle">Cantidad en KG</h3>
    <div class="item-info" id="kgItemInfo"></div>

    <div id="flejesRollosGrid" style="display:none"></div>

    <div id="kgInputGroup">
      <label style="display:block;margin-bottom:8px;font-size:16px;font-weight:700">KG</label>
      <input type="text" id="inputKgValue" inputmode="decimal" placeholder="0,0" />
    </div>

    <div id="rollosInputGroup" style="display:none;margin-top:14px">
      <label style="display:block;margin-bottom:8px;font-size:16px;font-weight:700">Rollos</label>
      <input type="text" id="inputRollos" inputmode="numeric" placeholder="0" />
    </div>

    <div id="pesoRolloInputGroup" style="display:none;margin-top:14px">
      <label style="display:block;margin-bottom:8px;font-size:16px;font-weight:700">Peso x Rollo</label>
      <input type="text" id="inputPesoRollo" inputmode="decimal" placeholder="0,0" />
    </div>

    <div class="actions" style="margin-top:20px">
      <button class="btn btn-secondary" id="kgCancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="kgConfirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal previo (flejes): KG estipulados según remito -->
<div id="estipPopup" class="input-kg-popup">
  <div class="kg-modal">
    <h3>KG Estipulados</h3>
    <div class="item-info" id="estipItemInfo"></div>
    <label style="display:block;margin-bottom:8px;font-size:18px;font-weight:700">KG estipulados (según remito)</label>
    <input type="text" id="inputEstip" inputmode="decimal" placeholder="0,0" />
    <div class="actions" style="margin-top:20px">
      <button class="btn btn-secondary" id="estipCancelBtn">Cancelar</button>
      <button class="btn btn-primary" id="estipNextBtn">Continuar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Proveedores por rubro
const PROVEEDORES = {
  Flejes: ["Basconia","Aperam","Hermac","Brawin","Altrak","Szapiro","EstaMetal","JL Metales","Alami"],
  Cajas: ["Corrugadora"],
  Plasticos: ["Pat Bet Plast","Rodar","Telleria","Maspoli","Pintos","Martin Faccolo","JL Matriceria","Capuchon Mariposa","Base Afila","M. Pelador","Terrero","Mangos Abrelata","Regatones","Bujes Abrelatas","Mango Ergon.","Mangos NM","Packaging y Serv","Sesega","Barbeja"],
  Cartones: ["Grafica Pol"],
  Remaches: ["Bella Vista","Dilmax","Electronica Mandelli","Imel"],
  Bombillas: ["Por definir"]
};

// Unidad por rubro (default) + excepciones por proveedor
// Tipos: "Kg" (decimal), "Uni" (entero), "Millares" (entero), "Litros" (decimal), "Cajas" (entero)
const UNIDADES = {
  Flejes:    { _default: "Kg" },
  Cajas:     { _default: "Cajas" },
  Cartones:  { _default: "Uni" },
  Plasticos: { _default: "Uni", "Martin Faccolo": "Kg", "Sesega": "Kg", "Barbeja": "Uni" },
  Remaches:  { _default: "Millares", "Dilmax": "Litros" },
  Bombillas: { _default: "Uni" }
};

function getUnidad(rubro, prov) {
  const cfg = UNIDADES[rubro] || {};
  return cfg[prov] || cfg._default || "Uni";
}

function esDecimal(unidad) {
  return unidad === "Kg" || unidad === "Litros";
}

// Tablas fuente por rubro
const TABLAS = {
  Flejes:    { tabla: "Flejes",           colCod: "N Fleje",  colDesc: "Descripción", colIsis: "Cod_ISIS", colMedida: "Medida mm", colProv: "Proveedor" },
  Cajas:     { tabla: "Cajas",            colCod: "N_Caja",   colDesc: "Cod_ISIS_LK",          colProv: null },
  Plasticos: { tabla: "Partes_Plasticas", colCod: "Cod_ISIS", colDesc: "Descripcion",          colProv: "Proveedor" },
  Cartones:  { tabla: "Despiece x Articulo", colCod: "COD",  colDesc: "Descripcion de partes", colProv: null, filtro: { col: "Rubro", val: "Cartones" } },
  // Remaches: especial - une Remaches SC + Remaches SP. Manejado por separado en cargarRemaches().
  Remaches:  { especial: "remaches" },
  Bombillas: { tabla: "Bombillas",        colCod: "Sector",   colDesc: "Descripcion",          colProv: "Proveedor" }
};

let rubroSel = "";
let provSel = "";
let items = [];
let filteredItems = [];
let selectedItem = null;

const rubroGrid = document.getElementById("rubroGrid");
const provSection = document.getElementById("provSection");
const provGrid = document.getElementById("provGrid");
const remitoSection = document.getElementById("remitoSection");
const btnContinuarRow = document.getElementById("btnContinuarRow");
const btnContinuar = document.getElementById("btnContinuar");
const statusMsg = document.getElementById("statusMsg");
const successBox = document.getElementById("successBox");
const successDetail = document.getElementById("successDetail");
const overlay = document.getElementById("overlay");
const linesWrap = document.getElementById("lines");
const modalTitle = document.getElementById("modalTitle");
const modalMsg = document.getElementById("modalMsg");
const txtRemito = document.getElementById("txtRemito");
const searchInput = document.getElementById("searchInput");
const inputKgPopup = document.getElementById("inputKgPopup");
const kgItemInfo = document.getElementById("kgItemInfo");
const inputKgValue = document.getElementById("inputKgValue");
const kgConfirmBtn = document.getElementById("kgConfirmBtn");
const kgCancelBtn = document.getElementById("kgCancelBtn");

function esc(s) { return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function arDateISO() {
  return new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Argentina/Buenos_Aires",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}

// ===== Rubro =====
rubroGrid.querySelectorAll(".prov-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    rubroSel = btn.dataset.rubro;
    rubroGrid.querySelectorAll(".prov-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderProveedores();
  });
});

function renderProveedores() {
  const provs = PROVEEDORES[rubroSel] || [];
  provGrid.innerHTML = "";
  provSel = "";

  if (provs.length === 1) {
    provSel = provs[0];
    provSection.classList.add("hidden");
  } else {
    provs.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "prov-btn";
      btn.textContent = p;
      btn.addEventListener("click", () => {
        provSel = p;
        provGrid.querySelectorAll(".prov-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        updateReady();
      });
      provGrid.appendChild(btn);
    });
    provSection.classList.remove("hidden");
  }

  remitoSection.classList.remove("hidden");
  updateReady();
}

function updateReady() {
  const ok = rubroSel && provSel;
  btnContinuar.disabled = !ok;
  btnContinuarRow.style.display = "";
}

// ===== Cargar artículos =====
btnContinuar.addEventListener("click", async () => {
  btnContinuar.disabled = true;
  statusMsg.textContent = "Cargando artículos...";
  statusMsg.className = "status";

  try {
    const cfg = TABLAS[rubroSel];
    let data, error;

    if (cfg.especial === "remaches") {
      // Remaches: une Remaches SC + Remaches SP filtrando por proveedor
      const [scRes, spRes] = await Promise.all([
        sb.from("Remaches SC").select("*").eq("Proveedor", provSel),
        sb.from("Remaches SP").select("*").eq("Proveedor", provSel)
      ]);
      if (scRes.error) throw scRes.error;
      if (spRes.error) throw spRes.error;
      const scRows = (scRes.data || []).map(r => ({ cod: r["SC"], desc: r["Descripción"], isis: "", medida: "" }));
      const spRows = (spRes.data || []).map(r => ({ cod: r["SP"], desc: r["Descripción"], isis: "", medida: "" }));
      data = [...scRows, ...spRows];
      data.sort((a,b) => String(a.cod).localeCompare(String(b.cod), "es"));
    } else {
      let query = sb.from(cfg.tabla).select("*");
      if (cfg.colProv && provSel) query = query.eq(cfg.colProv, provSel);
      if (cfg.filtro) query = query.eq(cfg.filtro.col, cfg.filtro.val);
      const res = await query.order(cfg.colCod, { ascending: true });
      if (res.error) throw res.error;
      data = (res.data || []).map(r => ({
        cod: String(r[cfg.colCod] ?? "").trim(),
        desc: String(r[cfg.colDesc] ?? "").trim(),
        isis: cfg.colIsis ? String(r[cfg.colIsis] ?? "").trim() : "",
        medida: cfg.colMedida ? String(r[cfg.colMedida] ?? "").trim() : ""
      }));
    }

    const seen = new Set();
    items = data.filter(r => {
      const cod = String(r.cod ?? "").trim();
      if (!cod || seen.has(cod)) return false;
      seen.add(cod);
      return true;
    }).map(r => ({
      codigo: String(r.cod).trim(),
      descripcion: String(r.desc ?? "").trim(),
      isis: String(r.isis ?? "").trim(),
      medida: String(r.medida ?? "").trim(),
      _cant: "",
      _rollos: "",
      _pesoRollo: ""
    }));

    if (!items.length) {
      statusMsg.textContent = "No hay artículos para este proveedor.";
      statusMsg.className = "status bad";
      btnContinuar.disabled = false;
      return;
    }

    statusMsg.textContent = "";
    modalTitle.textContent = `${provSel} — ${items.length} artículos`;
    buildModal();
    overlay.classList.add("open");

  } catch (err) {
    console.error(err);
    statusMsg.textContent = "Error: " + err.message;
    statusMsg.className = "status bad";
    btnContinuar.disabled = false;
  }
});

// ===== Modal =====
function renderItems() {
  linesWrap.innerHTML = "";
  filteredItems.forEach((item, i) => {
    const btn = document.createElement("button");
    btn.className = "item-btn" + (item._cant ? " active" : "");
    btn.innerHTML = `<div class="code">${esc(item.codigo)}</div>`;
    if (item.isis) btn.innerHTML += `<div class="isis">ISIS: ${esc(item.isis)}</div>`;
    if (item.medida) btn.innerHTML += `<div class="medida">${esc(item.medida)}</div>`;
    if (item._cant) {
      btn.innerHTML += `<div class="medida" style="margin-top:8px;color:#0a7a2f;font-weight:700">${esc(item._cant)} kg`;
      if (item._rollos) btn.innerHTML += ` · ${item._rollos} rollos`;
      btn.innerHTML += `</div>`;
    }
    btn.addEventListener("click", () => onItemClick(item));
    linesWrap.appendChild(btn);
  });
}

function filterItems() {
  if (rubroSel === "Flejes") {
    // Buscador flejes: UN solo input. Ignora espacios y trata coma y punto igual.
    // Busca por MEDIDA (substring) o por N° de fleje (código).
    const el = document.getElementById("fm_a");
    const norm = (s) => String(s || "").toLowerCase().replace(/\s+/g, "").replace(/,/g, ".").replace(/×/g, "x");
    const q = norm(el.value);
    el.classList.toggle("on", q !== "");
    // La "x" separa dimensiones: cada parte se busca por separado y SIN importar el orden
    // (ej. "1.25x77" == "77x1.25", y "1.25x" == "1.25"). Con una sola parte, matchea
    // también el N° de fleje (código).
    const tokens = q.split("x").filter(t => t !== "");
    filteredItems = items.filter(it => {
      if (!tokens.length) return true;
      const m = norm(it.medida);
      const cod = norm(it.codigo);
      const enMedida = tokens.every(t => m.includes(t));
      const enCodigo = tokens.length === 1 && cod.includes(tokens[0]);
      return enMedida || enCodigo;
    });
  } else {
    const q = searchInput.value.toLowerCase();
    filteredItems = items.filter(it => {
      const text = (it.codigo + " " + it.descripcion + " " + it.isis + " " + it.medida).toLowerCase();
      return text.includes(q);
    });
  }
  renderItems();
}

function buildModal() {
  linesWrap.innerHTML = "";
  modalMsg.textContent = "";
  const esFlejes = rubroSel === "Flejes";
  // En flejes el buscador es UN input de medida/N°; en el resto, el buscador de texto.
  searchInput.style.display = esFlejes ? "none" : "";
  document.getElementById("flejesSearch").style.display = esFlejes ? "flex" : "none";
  searchInput.value = "";
  { const el = document.getElementById("fm_a"); el.value = ""; el.classList.remove("on"); }
  filteredItems = [...items];

  searchInput.addEventListener("input", filterItems);
  renderItems();
  setTimeout(() => (esFlejes ? document.getElementById("fm_a") : searchInput).focus(), 100);
}

// Listener del buscador de flejes (1 input) — se registra una vez (elemento estático).
// Permite dígitos, letras (N° tipo "90B"), coma, punto, "x"/"×" y espacios.
(() => {
  const el = document.getElementById("fm_a");
  el.addEventListener("input", () => {
    el.value = el.value.replace(/[^0-9a-zA-Z.,x×\s]/g, "");
    filterItems();
  });
})();
document.getElementById("fmClear").addEventListener("click", () => {
  const el = document.getElementById("fm_a"); el.value = ""; el.classList.remove("on");
  filterItems();
});

// ===== Grilla de rollos por peso (flejes) =====
// Modelo: flejesCols = [ {count, kg}, ... ]. col0 = "bulk" (varios del mismo peso,
// count editable). col>=1 = rollos sueltos de otro peso (count fijo = 1). El "+"
// agrega un rollo suelto y descuenta 1 del bulk. Total Kg = Σ count*kg = lo guardado.
let flejesCols = [];

function rgFmt(n) {
  return Number(n || 0).toLocaleString("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 3 });
}

function rgComputa() {
  let grand = 0, totalRollos = 0;
  const kt = flejesCols.map((c, i) => {
    const cnt = i === 0 ? (parseInt(c.count, 10) || 0) : 1;
    const kg = parseFloat(String(c.kg).replace(",", ".")) || 0;
    totalRollos += cnt;
    const v = cnt * kg;
    grand += v;
    return v;
  });
  return { kt, grand, totalRollos };
}

function rgSync(grand, totalRollos) {
  document.getElementById("inputKgValue").value = grand ? String(grand) : "";
  document.getElementById("inputRollos").value = totalRollos ? String(totalRollos) : "";
}

function recalcFlejesTotalsOnly() {
  const { kt, grand, totalRollos } = rgComputa();
  const cont = document.getElementById("flejesRollosGrid");
  cont.querySelectorAll(".rg-row-kgtot td:not(.rg-pad)").forEach((td, idx) => {
    if (kt[idx] !== undefined) td.textContent = rgFmt(kt[idx]);
  });
  const totalCell = cont.querySelector(".rg-row-total td");
  if (totalCell) totalCell.textContent = `${rgFmt(grand)} kg · ${totalRollos} rollo(s)`;
  const estipWrap = document.getElementById("rgEstipWrap");
  if (estipWrap) estipWrap.innerHTML = rgEstipInfo(grand);
  rgSync(grand, totalRollos);
}

function renderFlejesGrid() {
  const cont = document.getElementById("flejesRollosGrid");
  const { kt, grand, totalRollos } = rgComputa();
  const n = flejesCols.length;
  const rolloTds = flejesCols.map((c, i) => i === 0
    ? `<td><input class="rg-count" inputmode="numeric" value="${esc(String(c.count || ""))}" placeholder="0"></td>`
    : `<td><span class="rg-one">1</span><button class="rg-rm" type="button" data-i="${i}" title="Quitar rollo">×</button></td>`
  ).join("");
  const kgTds = flejesCols.map((c, i) =>
    `<td><input class="rg-kg" data-i="${i}" inputmode="decimal" value="${esc(String(c.kg || ""))}" placeholder="0,0"></td>`
  ).join("");
  const kgTotTds = flejesCols.map((c, i) => `<td>${rgFmt(kt[i])}</td>`).join("");
  cont.innerHTML = `
    <div class="rg-label">Rollos y peso</div>
    <div class="rg-scroll">
    <table class="rollos-grid">
      <tr class="rg-row-rollo"><th>Rollo</th>${rolloTds}<td class="rg-pad"></td></tr>
      <tr class="rg-row-kg"><th>Kg</th>${kgTds}<td class="rg-plus-cell"><button id="rgPlus" type="button" title="Agregar un rollo de otro peso">+</button></td></tr>
      <tr class="rg-row-kgtot"><th>Kg Total</th>${kgTotTds}<td class="rg-pad"></td></tr>
      <tr class="rg-row-total"><th>Total</th><td colspan="${n + 1}">${rgFmt(grand)} kg · ${totalRollos} rollo(s)</td></tr>
    </table>
    </div>
    <div id="rgEstipWrap">${rgEstipInfo(grand)}</div>`;
  rgSync(grand, totalRollos);

  const countEl = cont.querySelector(".rg-count");
  if (countEl) countEl.addEventListener("input", () => {
    countEl.value = countEl.value.replace(/\D/g, "");
    flejesCols[0].count = countEl.value;
    recalcFlejesTotalsOnly();
  });
  cont.querySelectorAll(".rg-kg").forEach(el => el.addEventListener("input", () => {
    el.value = el.value.replace(/[^0-9.,]/g, "").replace(/([.,].*)[.,]/g, "$1");
    flejesCols[Number(el.dataset.i)].kg = el.value;
    recalcFlejesTotalsOnly();
  }));
  cont.querySelectorAll(".rg-rm").forEach(el => el.addEventListener("click", () => {
    const i = Number(el.dataset.i);
    flejesCols[0].count = String((parseInt(flejesCols[0].count, 10) || 0) + 1);
    flejesCols.splice(i, 1);
    renderFlejesGrid();
  }));
  const plus = document.getElementById("rgPlus");
  if (plus) plus.addEventListener("click", () => {
    const b = parseInt(flejesCols[0].count, 10) || 0;
    if (b > 0) flejesCols[0].count = String(b - 1);
    flejesCols.push({ count: 1, kg: "" });
    renderFlejesGrid();
  });
}

// Click en un artículo: flejes preguntan primero los KG estipulados; el resto va directo.
function onItemClick(item) {
  if (rubroSel === "Flejes") openEstipPopup(item);
  else openKgPopup(item);
}

function openEstipPopup(item) {
  selectedItem = item;
  document.getElementById("estipItemInfo").innerHTML =
    `<strong>${esc(item.codigo)}</strong> - ${esc(item.descripcion)}` +
    (item.medida ? `<br>Medida: <strong>${esc(item.medida)}</strong>` : "");
  document.getElementById("inputEstip").value = item._estipulado || "";
  document.getElementById("estipPopup").classList.add("open");
  setTimeout(() => document.getElementById("inputEstip").focus(), 100);
}

function closeEstipPopup() {
  document.getElementById("estipPopup").classList.remove("open");
}

// Info del estipulado vs total (para mostrar debajo del Total en la grilla).
function rgEstipInfo(grand) {
  const est = parseFloat(String((selectedItem && selectedItem._estipulado) || "").replace(",", ".")) || 0;
  if (!est) return "";
  const dif = Math.round((grand - est) * 100) / 100;
  if (Math.abs(dif) < 0.05) return `<div class="rg-estip rg-est-ok">Estipulado: ${rgFmt(est)} kg · coincide ✓</div>`;
  if (dif < 0) return `<div class="rg-estip rg-est-bad">Estipulado: ${rgFmt(est)} kg · faltan ${rgFmt(-dif)} kg</div>`;
  return `<div class="rg-estip rg-est-bad">Estipulado: ${rgFmt(est)} kg · sobran ${rgFmt(dif)} kg</div>`;
}

function openKgPopup(item) {
  selectedItem = item;
  kgItemInfo.innerHTML = `<strong>${esc(item.codigo)}</strong> - ${esc(item.descripcion)}`;
  if (item.isis) kgItemInfo.innerHTML += ` <br><small>ISIS: ${esc(item.isis)}</small>`;
  if (rubroSel === "Flejes") kgItemInfo.innerHTML += ` <br>Medida: <strong>${esc(item.medida || "—")}</strong>`;

  // Flejes: grilla de rollos por peso. Otros rubros: input KG simple.
  const isFlejes = rubroSel === "Flejes";
  document.getElementById("flejesRollosGrid").style.display = isFlejes ? "block" : "none";
  document.getElementById("kgInputGroup").style.display = isFlejes ? "none" : "block";
  document.getElementById("rollosInputGroup").style.display = "none";
  document.getElementById("pesoRolloInputGroup").style.display = "none";
  document.getElementById("kgModalTitle").textContent = isFlejes ? "Recepción de Fleje" : "Cantidad en KG";

  if (isFlejes) {
    flejesCols = (Array.isArray(item._rollosBreak) && item._rollosBreak.length)
      ? item._rollosBreak.map((c, i) => ({ count: i === 0 ? String(c.count) : 1, kg: (c.kg || c.kg === 0) ? String(c.kg) : "" }))
      : [{ count: "", kg: "" }, { count: 1, kg: "" }];
    renderFlejesGrid();
  } else {
    inputKgValue.value = item._cant || "";
  }

  inputKgPopup.classList.add("open");
  setTimeout(() => {
    const f = isFlejes ? document.querySelector("#flejesRollosGrid .rg-count") : inputKgValue;
    if (f) f.focus();
  }, 100);
}

function closeKgPopup() {
  inputKgPopup.classList.remove("open");
  selectedItem = null;
}

function closeModalFn() {
  overlay.classList.remove("open");
  btnContinuar.disabled = false;
  searchInput.removeEventListener("input", filterItems);
}

document.getElementById("closeModal").onclick = closeModalFn;
document.getElementById("cancelModal").onclick = closeModalFn;
overlay.addEventListener("click", e => { if (e.target === overlay) closeModalFn(); });

// Manejo del popup de kg
inputKgValue.addEventListener("input", () => {
  inputKgValue.value = inputKgValue.value.replace(/[^0-9.,]/g, "").replace(/([.,].*)[.,]/g, "$1");
});

document.getElementById("inputRollos").addEventListener("input", () => {
  document.getElementById("inputRollos").value = document.getElementById("inputRollos").value.replace(/\D/g, "");
});

document.getElementById("inputPesoRollo").addEventListener("input", () => {
  const el = document.getElementById("inputPesoRollo");
  el.value = el.value.replace(/[^0-9.,]/g, "").replace(/([.,].*)[.,]/g, "$1");
});

inputKgValue.addEventListener("keydown", e => {
  if (e.key === "Enter") kgConfirmBtn.click();
});

document.getElementById("inputRollos").addEventListener("keydown", e => {
  if (e.key === "Enter") kgConfirmBtn.click();
});

document.getElementById("inputPesoRollo").addEventListener("keydown", e => {
  if (e.key === "Enter") kgConfirmBtn.click();
});

// ===== Modal previo: KG estipulados (flejes) =====
document.getElementById("inputEstip").addEventListener("input", () => {
  const el = document.getElementById("inputEstip");
  el.value = el.value.replace(/[^0-9.,]/g, "").replace(/([.,].*)[.,]/g, "$1");
});
document.getElementById("estipNextBtn").addEventListener("click", () => {
  if (!selectedItem) return;
  selectedItem._estipulado = document.getElementById("inputEstip").value.trim();
  closeEstipPopup();
  openKgPopup(selectedItem);
});
document.getElementById("estipCancelBtn").addEventListener("click", closeEstipPopup);
document.getElementById("inputEstip").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("estipNextBtn").click();
});
document.getElementById("estipPopup").addEventListener("click", e => {
  if (e.target === document.getElementById("estipPopup")) closeEstipPopup();
});

kgConfirmBtn.addEventListener("click", () => {
  if (!selectedItem) return;
  const isFlejes = rubroSel === "Flejes";
  if (isFlejes) recalcFlejesTotalsOnly(); // asegura inputKgValue/inputRollos al día
  const val = inputKgValue.value.trim();

  if (val && Number(val.replace(",", ".")) > 0) {
    selectedItem._cant = val;
    if (isFlejes) {
      selectedItem._rollos = document.getElementById("inputRollos").value.trim();
      selectedItem._pesoRollo = "";
      selectedItem._rollosBreak = flejesCols.map((c, i) => ({
        count: i === 0 ? (parseInt(c.count, 10) || 0) : 1,
        kg: parseFloat(String(c.kg).replace(",", ".")) || 0
      })).filter(c => c.count > 0);
    }
    renderItems();
  }
  closeKgPopup();
});

kgCancelBtn.addEventListener("click", closeKgPopup);

inputKgPopup.addEventListener("click", e => {
  if (e.target === inputKgPopup) closeKgPopup();
});

// ===== Enviar =====
document.getElementById("sendModal").addEventListener("click", async () => {
  const unidad = getUnidad(rubroSel, provSel);
  const parseCant = (s) => Number(String(s || "").replace(",", ".")) || 0;

  const toSend = items.filter(it => parseCant(it._cant) > 0);
  if (!toSend.length) {
    modalMsg.textContent = "Completá al menos una cantidad.";
    modalMsg.className = "status bad";
    return;
  }

  const resumen = toSend.map(it => `${it.codigo}: ${it._cant} ${unidad}`).join("\n");
  if (!confirm(`Registrar recepción de ${provSel}?\n\n${resumen}`)) return;

  const sendBtn = document.getElementById("sendModal");
  sendBtn.disabled = true;
  modalMsg.textContent = "Guardando...";
  modalMsg.className = "status";

  try {
    const remito = txtRemito.value.trim();
    const registros = toSend.map(it => {
      const reg = {
        fecha: arDateISO(),
        proveedor: provSel,
        rubro: rubroSel,
        codigo: it.codigo,
        descripcion: it.descripcion,
        cantidad: parseCant(it._cant),
        unidad: unidad,
        remito: remito || null
      };
      // Agregar campos adicionales para Flejes
      if (rubroSel === "Flejes") {
        reg.rollos = it._rollos ? parseInt(it._rollos) || null : null;
        reg.peso_x_rollo = null; // reemplazado por el desglose por peso
        reg.rollos_json = (Array.isArray(it._rollosBreak) && it._rollosBreak.length) ? it._rollosBreak : null;
        reg.kg_estipulado = it._estipulado ? parseFloat(String(it._estipulado).replace(",", ".")) || null : null;
      }
      return reg;
    });

    const { data, error } = await sb.from("Recepcion_Insumos").insert(registros).select();
    if (error) throw error;
    if (!data || data.length === 0) {
      modalMsg.textContent = "No se registró ningún artículo. Sesión expirada? Reingresá con Google.";
      modalMsg.className = "status bad";
      sendBtn.disabled = false;
      return;
    }

    overlay.classList.remove("open");
    successDetail.textContent = `${data.length} artículo(s) de ${provSel} · Remito: ${remito || "—"}`;
    successBox.style.display = "block";
    statusMsg.textContent = "";

  } catch (err) {
    console.error(err);
    modalMsg.textContent = "Error: " + err.message;
    modalMsg.className = "status bad";
    sendBtn.disabled = false;
  }
});
</script>

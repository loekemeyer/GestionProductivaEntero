<!doctype html>
<html lang="es">
<head>
  <script src="../../auth-guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Control Proveedores de Servicios</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="ControlPS.css?v=3" />
</head>
<body>

  <div class="card">

    <h1>Control Proveedores de Servicios</h1>

   <div class="row-tools">
    <button id="btnIndex" class="btn-index" type="button">
      ⌂ Inicio
    </button>
  
    <button id="btnVolver" class="btn-volver hidden" type="button">
      ← Cambiar proveedor
    </button>

    <input id="filtroDesc" class="filtro-desc hidden" type="text"
           placeholder="🔍 Filtrar por descripción..." autocomplete="off" />

    <button id="btnImprimir" class="btn-imprimir hidden" type="button">
      🖨 Imprimir
    </button>

  </div>

    <div class="row">
      <div id="talleristasGrid" class="talleristas-grid"></div>
    </div>

    <div id="status" class="status"></div>

    <div id="result"></div>

  </div>

  <!-- JS -->
  <script src="ControlPS.js?v=11"></script>

</body>
</html>

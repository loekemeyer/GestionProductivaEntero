<!doctype html>
<html lang="es">
<head>
<script src="../auth-guard.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Relevamiento</title>
<link rel="stylesheet" href="../tandas-popup.css?v=20260730i"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f5f6f8;color:#111;padding:12px}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

  .topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .topbar h1{font-size:20px;font-weight:800}
  .topbar .spacer{flex:1}
  .btn{padding:13px 20px;min-height:48px;border:none;border-radius:10px;font-size:17px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-dark{background:#111;color:#fff}
  .btn-ghost{background:#fff;border:2px solid #d0d7de;color:#111}
  .btn-green{background:#0a7a2f;color:#fff}
  .btn-red{background:#fff;border:2px solid #e11;color:#c00}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:10px 14px;min-height:44px;font-size:15px;border-radius:8px}

  .card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden}
  .card h2{background:#111;color:#fff;padding:12px 16px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card .body{padding:14px 16px}

  /* nuevo */
  .form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:#555;font-weight:700}
  .field select,.field input{height:50px;border:2px solid #d0d7de;border-radius:8px;padding:0 12px;font-size:17px;background:#fff}
  .field select:focus,.field input:focus{outline:none;border-color:#111}

  /* resumen */
  table{border-collapse:collapse;width:100%;font-size:19px}
  /* La tabla de carga NO se estira: cada columna se ajusta a su contenido (columnas de conteo no dejan huecos) */
  #detTable{width:auto;margin:0 auto}
  #detTable.combined{width:auto;margin:0 auto}
  #detTable.combined td, #detTable.combined th{padding:7px 12px}
  #detTable.combined td.comp-cell{cursor:pointer}
  #detTable.combined td.comp-cell:hover{background:#eef4f9}
  #detBody tr.ro-row{cursor:pointer}
  #detBody tr.ro-row:hover td{background:#f2f7fb}
  .comp-tabla{width:100%;border-collapse:collapse;font-size:18px}
  .comp-tabla td{border:1px solid #d7dde3;padding:8px 12px}
  .comp-tabla td.lbl{text-align:left;font-weight:600}
  .comp-tabla td.val{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
  .comp-tabla tr.sub td{background:#f6f8fa;color:#3a4653}
  .comp-tabla tr.tot td{background:#dff3e6;font-size:20px}
  .comp-sub{font-size:13px;color:#5a6672;margin-bottom:8px}
  /* Popup de composición más grande (solo #modalComp) */
  #modalComp .modal{max-width:600px;gap:16px;padding:24px}
  #modalComp h3{font-size:26px}
  #modalComp .comp-sub{font-size:17px;margin-bottom:12px}
  #modalComp .comp-tabla{font-size:24px}
  #modalComp .comp-tabla td{padding:14px 20px}
  #modalComp .comp-tabla tr.tot td{font-size:28px}
  #modalComp .modal-actions .btn{font-size:21px;padding:15px 34px;min-height:56px}
  .tbl-scroll{overflow-x:auto}
  th,td{border:1px solid #111;padding:8px 9px;text-align:center;vertical-align:middle;white-space:nowrap;box-sizing:border-box}
  thead th{background:#e9eef3;color:#26313c;font-weight:800;position:sticky;top:0}
  .resumen td.cell{text-align:center;font-variant-numeric:tabular-nums}
  .resumen thead th{font-size:21px;font-weight:800;text-align:center}
  .resumen td.tipo{font-size:19px;font-weight:800;text-align:center}
  .resumen .enc{font-size:18px;font-weight:800;margin-top:3px;color:#1b2430}
  .resumen td.cell-ok{background:#dff3e6}
  .resumen td.cell-inc,.resumen td.cell-falta{background:#fbe0e0}
  .resumen td .falta{color:#c00;font-weight:800}
  .resumen td.cell[data-relid]:hover{filter:brightness(.96)}
  .resumen td.tipo[data-grupo]{cursor:pointer;text-decoration:underline}
  .resumen td.tipo[data-grupo]:hover{background:#eef4f0}
  .pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.full{background:#e6f5ec;color:#0a7a2f}
  .pill.part{background:#fdf3e2;color:#a8620b}
  .pill.zero{background:#f0f2f4;color:#8a96a2}
  .muted{color:#8a96a2}

  /* lista relevamientos */
  .rel-list{display:flex;flex-direction:column;gap:8px}
  .rel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px solid #e7ebef;border-radius:10px}
  .rel .lugar{font-weight:800}
  .rel .tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:#eef2f6;color:#3a4653;text-transform:uppercase;letter-spacing:.04em}
  .rel .fecha{font-size:12.5px;color:#5a6672}
  .rel .prog{font-size:12.5px;font-weight:700}
  .rel .rel-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .bar{height:6px;background:#eef0f2;border-radius:4px;overflow:hidden;min-width:120px;flex:0 0 120px}
  .bar > i{display:block;height:100%;background:#0a7a2f}

  /* grupos: 1 relevamiento = varios lugares */
  .grupo{border:1px solid #e2e7ec;border-radius:10px;overflow:hidden}
  .grupo.incompleto{border-color:#e6a2a2}
  .grupo-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;background:#f4f7f9}
  .grupo.incompleto .grupo-head{background:#fdf0f0}
  .grupo-lugares{display:flex;flex-direction:column;gap:6px;padding:8px 12px}
  .lugar-chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border-radius:8px}
  .lugar-chip.incompleto{background:#fdecec}
  .lugar-chip.ok{background:#eef6f0}
  .lugar-chip .lc-info{flex:1;min-width:170px;font-size:14px}
  .lugar-chip .lc-info b{font-size:15px}
  .lugar-chip .cnt{font-weight:800;margin:0 6px}
  .lugar-chip .lc-fecha{color:#5a6672}
  .lugar-chip .lc-acts{display:flex;gap:6px;margin-left:auto}
  #detBody tr.dirty td.desc::after{content:" ●";color:#c00}
  .det-lugares{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .lug-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;font-size:15px;font-weight:600}
  .lug-tag.incompleto{background:#fdecec} .lug-tag.ok{background:#eef6f0}
  .lug-tag .cnt{font-weight:800}
  #detTable td.num{text-align:center;font-variant-numeric:tabular-nums;font-weight:800;font-size:23px}
  #detTable tr.tot-row td{background:#e9eef3;font-size:23px;text-align:center}
  .guardar-bottom{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
  .big-save{min-width:300px;min-height:66px;font-size:23px}

  /* modal agregar lugar */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal h3{font-size:18px;font-weight:800}
  .modal .field{width:100%}
  .modal .field select,.modal .field input{width:100%}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}

  /* detalle carga */
  .det-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .det-head .search{height:50px;border:2px solid #d0d7de;border-radius:8px;padding:0 12px;font-size:18px;flex:1;min-width:200px}
  .det-head .prog{font-weight:800}
  td input.ci{width:82px;height:50px;border:2px solid #b4bcc4;border-radius:8px;text-align:center;font-size:20px;font-weight:700}
  td input.ci:focus{outline:none;border-color:#111}
  td input.ci.ci-error{border-color:#c00;background:#fdecec}
  .ci-tandas{margin-left:6px;height:50px;min-width:46px;border:2px solid #1f6b86;background:#e3eef2;color:#1f6b86;border-radius:8px;font-size:17px;font-weight:800;cursor:pointer;vertical-align:middle}
  .ci-tandas:active{background:#cfe2ea}
  .ci-zero{margin-left:6px;height:50px;min-width:40px;border:2px solid #9aa6b2;background:#eef1f4;color:#3a4653;border-radius:8px;font-size:17px;font-weight:800;cursor:pointer;vertical-align:middle}
  .ci-zero:active{background:#e2e7ec}
  td input.ci.ci-tanda-only{cursor:pointer;background:#eef4f9;caret-color:transparent}
  tr.loaded td.desc{color:#0a7a2f}
  #detTable td.desc{white-space:normal;word-break:break-word;line-height:1.2;text-align:center;font-weight:600}
  #detHead th{vertical-align:middle;line-height:1.2}
  tr.saving td.desc::after{content:" ·guardando";color:#a8620b;font-size:11px}
  .hidden{display:none!important}

  .msg{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600}
  .msg.ok{background:#e6f5ec;color:#0a7a2f}
  .msg.err{background:#fdecec;color:#c00}
  .empty{color:#8a96a2;font-size:14px;padding:8px 2px}

  /* cronograma (línea por línea, NO tabla) */
  #cronoBox{display:flex;flex-direction:column;gap:10px}
  .crono-linea{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid #111;border-radius:10px;background:#fff;cursor:default}
  .crono-linea[data-grupo]{cursor:pointer}
  .crono-linea[data-grupo]:hover{background:#f4f7fb}
  .crono-linea.completo{background:#f2faf5;border-color:#bfe3cd}
  .crono-linea.completo[data-grupo]:hover{background:#e8f5ee}
  .cl-tipo{font-size:19px;font-weight:800;min-width:120px}
  .cl-fecha{font-size:20px;font-weight:800;display:flex;flex-direction:column;line-height:1.05;min-width:130px}
  .cl-fecha .cl-lbl{font-size:11px;font-weight:700;color:#5a6672;text-transform:uppercase;letter-spacing:.04em}
  .cl-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:160px}
  .cl-btn{margin-left:auto}
  .crono-chip{display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:5px 10px;border-radius:8px;font-size:14px;font-weight:800;line-height:1.1}
  .crono-chip.ok{background:#dff3e6;color:#0a7a2f}
  .crono-chip.falta{background:#fbe0e0;color:#c00}
  .crono-chip .crono-enc{font-size:12px;font-weight:700;color:#3a4653}
  /* Estados de la FECHA (color + movimiento distinto por estado):
     VERDE=relevamiento completo (sin movimiento) · ROJO=venció sin hacer (rápido/amplio)
     NARANJA=es hoy (medio) · AMARILLO=faltan ≤3 días hábiles (suave/lento). */
  @keyframes crono-rojo{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px)}30%{transform:translateX(5px)}45%{transform:translateX(-5px)}60%{transform:translateX(5px)}75%{transform:translateX(-4px)}90%{transform:translateX(4px)}}
  @keyframes crono-naranja{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-3px)}}
  @keyframes crono-amarillo{0%,55%,100%{transform:translateX(0)}68%{transform:translateX(-2px)}80%{transform:translateX(2px)}92%{transform:translateX(-2px)}}
  .cl-fecha.est-verde{color:#0a7a2f}
  .cl-fecha.est-rojo{color:#c00;animation:crono-rojo .4s infinite}
  .cl-fecha.est-naranja{color:#ff7a00;animation:crono-naranja .7s infinite}
  .cl-fecha.est-amarillo{color:#f0b400;animation:crono-amarillo 1.5s infinite}
  /* Calendario mensual (modal) — ocupa todo el ancho y ALTO del dispositivo, sin scroll */
  #modalCalendario{padding:6px}
  #modalCalendario .modal{border-radius:10px;overflow:hidden}
  #calBody{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  #modalCalendario h3{font-size:24px;flex:none}
  .cal-head .cal-mes{font-size:clamp(22px,3vw,36px);font-weight:800;text-transform:capitalize}
  .cal-nav{border:1px solid #111;background:#fff;border-radius:8px;width:48px;height:48px;font-size:26px;font-weight:800;cursor:pointer;flex:none}
  /* 7 columnas que SIEMPRE entran (minmax 0) -> nunca hay scroll horizontal. */
  .cal-dowrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;flex:none}
  /* Las filas de días se reparten el alto restante (1fr) -> entra sin scroll vertical. */
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
  .cal-dow{text-align:center;font-size:clamp(12px,1.9vw,26px);font-weight:800;color:#5a6672;text-transform:uppercase;padding:2px 0;min-width:0;overflow:hidden}
  .cal-dia{min-height:0;border:1px solid #ccd3da;border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;min-width:0;overflow:hidden}
  .cal-dia.cal-vacio{background:#f4f6f8;border-color:#e6eaee}
  .cal-dia.cal-hoy{border-color:#111;border-width:2px}
  .cal-dnum{font-size:clamp(16px,2vw,32px);font-weight:800;color:#3a4653;align-self:center;text-align:center;line-height:1}
  .cal-ev{font-size:clamp(11px,1.7vw,28px);font-weight:800;border-radius:6px;padding:3px 6px;background:#eef1f4;color:#3a4653;text-align:center;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-ev.est-verde{background:#dff3e6;color:#0a7a2f}
  .cal-ev.est-rojo{background:#fbe0e0;color:#c00}
  .cal-ev.est-naranja{background:#ffe6cc;color:#c65a00}
  .cal-ev.est-amarillo{background:#fdf1cc;color:#8a6a00}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>📋 Relevamiento</h1>
    <span class="spacer"></span>
    <button class="btn btn-ghost hidden" id="btnExcelFlejes">📥 Descargar Excel</button>
    <button class="btn btn-ghost" id="btnCalendario">📅 Calendario</button>
    <a class="btn btn-ghost" href="../Inicio/index.html">← Inicio</a>
  </div>

  <div id="msg"></div>

  <!-- ====== VISTA LISTA ====== -->
  <div id="vistaLista" style="display:flex;flex-direction:column;gap:14px">

    <div class="card">
      <h2>📅 Cronograma</h2>
      <div class="body tbl-scroll" id="cronoBox">
        <div class="empty">Cargando…</div>
      </div>
    </div>
  </div>

  <!-- ====== VISTA DETALLE (carga) ====== -->
  <div id="vistaDetalle" class="card" style="display:none">
    <h2 id="detTitulo">Cargar relevamiento</h2>
    <div class="body">
      <div class="det-head">
        <button class="btn btn-ghost sm" id="btnVolver">← Volver</button>
        <input class="search" id="detSearch" placeholder="Buscar por descripción, sector o código…"/>
        <span class="prog" id="detProg"></span>
        <span class="prog" id="detUnsaved" style="color:#c00"></span>
        <button class="btn btn-green" id="btnGuardar" disabled>Guardar</button>
      </div>
      <div id="detLugares" class="det-lugares" style="display:none"></div>
      <div class="tbl-scroll">
        <table id="detTable">
          <thead id="detHead"></thead>
          <tbody id="detBody"></tbody>
        </table>
      </div>
      <div class="guardar-bottom" id="guardarBottomWrap">
        <button class="btn btn-green big-save" id="btnGuardarBottom" disabled>Guardar</button>
        <button class="btn btn-ghost big-save" id="btnAtrasBottom" disabled title="Se habilita después de guardar">← Atrás</button>
      </div>
    </div>
  </div>

  <!-- Modal: Realizar relevamiento (elegir lugar + encargado) -->
  <div id="modalRealizar" class="modal-bg" style="display:none">
    <div class="modal">
      <h3 id="rzTitulo">Realizar relevamiento</h3>
      <div class="field"><label>Lugar</label><select id="rzPlanta"></select></div>
      <div class="field"><label>Encargado <span style="color:#c00">*</span></label><input type="text" id="rzEncargado" placeholder="Obligatorio — quién releva"/></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rzCancelar">Cancelar</button>
        <button class="btn btn-green" id="rzConfirmar">Realizar</button>
      </div>
    </div>
  </div>

  <!-- Modal: composición de una celda (cómo se calculó el valor) -->
  <div id="modalComp" class="modal-bg" style="display:none">
    <div class="modal">
      <h3 id="compTitulo">Composición</h3>
      <div id="compBody"></div>
      <div class="modal-actions">
        <button class="btn btn-dark" id="compCerrar">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: calendario de fechas (actuales y siguientes) -->
  <div id="modalCalendario" class="modal-bg" style="display:none">
    <div class="modal" style="max-width:100%;width:100%;height:94vh;overflow:hidden">
      <h3>📅 Calendario de relevamientos</h3>
      <div id="calBody"></div>
      <div class="modal-actions">
        <button class="btn btn-dark" id="calCerrar">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal: agregar otro lugar al mismo relevamiento -->
  <div id="modalAgregar" class="modal-bg" style="display:none">
    <div class="modal">
      <h3 id="agTitulo">Agregar lugar</h3>
      <div class="field"><label>Lugar</label><select id="agPlanta"></select></div>
      <div class="field"><label>Fecha</label><input type="date" id="agFecha"/></div>
      <div class="field"><label>Encargado <span style="color:#c00">*</span></label><input type="text" id="agEncargado" placeholder="Obligatorio — quién releva"/></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="agCancelar">Cancelar</button>
        <button class="btn btn-dark" id="agConfirmar">Agregar</button>
      </div>
    </div>
  </div>

</div>

<script src="../version.js?v=20260617b"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../tandas-popup.js?v=20260730i"></script>
<script src="relevamiento.js?v=20260814f"></script>
</body>
</html>

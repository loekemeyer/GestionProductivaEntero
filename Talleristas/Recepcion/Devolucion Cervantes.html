<!doctype html>
<html lang="es">
<head>
<script src="../../auth-guard.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Devolución Cervantes</title>

<style>
  *{box-sizing:border-box}
  body{font-family:Arial;background:#fafafa;padding:18px}
  .card{max-width:560px;margin:auto;background:#fff;border:1px solid #d0d7de;border-radius:12px;padding:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  button{padding:10px 12px;border-radius:10px;border:2px solid #d0d7de;background:#fff;font-weight:800;cursor:pointer}
  button.active{background:#111;color:#fff;border-color:#111}
  button:disabled{opacity:.45;cursor:not-allowed}
  .send{background:#111;color:#fff;border:0;opacity:.45}
  .send.enabled{opacity:1}
  .status{margin-top:10px;font-size:14px}
  .ok{color:#0a7a2f;font-weight:800}
  .bad{color:#b42318}

  .destino-row{margin:14px 0}
  .destino-row label{font-weight:800;font-size:14px;display:block;margin-bottom:6px}
  .destino-btns{display:flex;gap:10px;flex-wrap:wrap}
  .destino-btns button{font-size:14px;padding:12px 16px;border-radius:10px;min-width:160px;text-align:center}
  .destino-btns button.dest-sc.active{background:#0a7a2f;color:#fff;border-color:#0a7a2f}
  .destino-btns button.dest-analizar.active{background:#b42318;color:#fff;border-color:#b42318}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:1000}
  .overlay.open{display:flex}
  .modal{
    width:min(820px, 100%);
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border:1px solid #d0d7de;
    border-radius:14px;
    padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.2);
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .modal-title{font-weight:900;font-size:20px}
  .xbtn{border:2px solid #d0d7de;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:900;font-size:16px}

  .grid{
    display:grid;
    grid-template-columns:120px 100px minmax(220px,1fr);
    gap:12px;
    align-items:center;
  }
  .grid .h{font-weight:900;font-size:16px;color:#333}
  .grid input[data-role="kg"]{
    width:100%!important;
    min-width:0;
    height:44px;
    font-size:18px;
    text-align:center;
    letter-spacing:0!important;
  }

  .descCell{
    font-size:16px;
    color:#333;
    line-height:1.3;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
  }

  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
  .btn-primary{background:#111;color:#fff;border:0;padding:12px 18px;font-size:15px}
  .btn-secondary{background:#fff;padding:12px 18px;font-size:15px}
  .hint{font-size:14px;color:#444;margin:10px 0 0}
  .hidden{display:none}

  .successBox{
    display:none;
    margin-top:12px;
    border:2px solid #c7e8d1;
    background:#f3fbf6;
    border-radius:12px;
    padding:12px;
  }
  .successBox .title{font-weight:900;margin:0 0 6px}
  .successCode{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    margin:6px 0 10px;
  }
  .okBtn{
    background:#111;color:#fff;border:0;
    padding:10px 14px;border-radius:10px;font-weight:900;
  }
  .codeRO{
    background:#f6f8fa;
    width:100%!important;
    height:44px;
    font-size:18px;
    font-weight:800;
    text-align:center!important;
    letter-spacing:0!important;
  }

  .destino-badge{
    display:inline-block;
    padding:4px 12px;
    border-radius:8px;
    font-weight:800;
    font-size:13px;
    margin-left:8px;
  }
  .destino-badge.sc{background:#d1fae5;color:#065f46}
  .destino-badge.analizar{background:#fee2e2;color:#991b1b}

  .motivo-row{margin:10px 0}
  .motivo-row label{font-weight:800;font-size:14px;display:block;margin-bottom:4px}
  .motivo-row textarea{
    width:100%;
    min-height:60px;
    border:2px solid #d0d7de;
    border-radius:10px;
    padding:10px;
    font-size:14px;
    font-family:Arial;
    resize:vertical;
  }
</style>
</head>

<body>
 <button onclick="gpHome()" class="btn-home" type="button">
   ← Inicio
 </button>
 <script>
   function gpHome(){
     var r = sessionStorage.getItem('gp_role') || 'admin';
     window.location.href = (r === 'envios') ? '../../envios-only.html' : '../../Inicio/index.html';

 </script>

<div class="card">
  <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px">
    <h2 style="margin:0">Devolución Talleristas Cervantes</h2>
    <button id="enviar" class="send" type="button" disabled>Cargar</button>
  </div>

  <div id="talleristasRow" class="row"></div>

  <div class="destino-row">
    <label>Destino de la devolución:</label>
    <div class="destino-btns">
      <button id="destSC" type="button" class="dest-sc" disabled>Vuelve a sector</button>
      <button id="destAnalizar" type="button" class="dest-analizar" disabled>Para Analizar</button>
    </div>
  </div>

  <div class="row" style="align-items:center;gap:8px">
    <label style="font-weight:800;font-size:14px">Fecha:</label>
    <input type="date" id="fechaDevolucion" style="height:38px;border-radius:10px;border:2px solid #d0d7de;padding:0 10px;font-size:14px">
  </div>

  <div class="motivo-row">
    <label>Motivo / observaciones (opcional):</label>
    <textarea id="motivoInput" placeholder="Ej: piezas con rebaba, medida fuera de tolerancia..."></textarea>
  </div>

  <div id="nombreTallProv" class="status"></div>
  <div id="status" class="status bad">Seleccioná un nombre para continuar.</div>

  <div id="successBox" class="successBox">
    <div class="title">Devolución registrada</div>
    <div>Tu código de devolución:</div>
    <div id="successCode" class="successCode">—</div>
    <button id="okBtn" class="okBtn" type="button">OK</button>
  </div>
</div>

<div id="overlay" class="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div>
        <span id="modalTitle" class="modal-title">Devolución — Sector y Kg</span>
        <span id="modalDestinoBadge" class="destino-badge"></span>
      </div>
      <button id="closeModal" class="xbtn" type="button">✕</button>
    </div>

    <div class="grid" style="margin-bottom:8px">
      <div class="h">Sector</div>
      <div class="h">Cantidad</div>
      <div class="h">Descripción</div>
    </div>

    <div id="lines" class="grid"></div>

    <div class="hint" id="modalHint">Tip: completá la cantidad de las partes devueltas en su unidad (kg para SP/SC, uni para cartones/cajas).</div>

    <div class="modal-actions">
      <button id="cancelModal" class="xbtn btn-secondary" type="button">Cancelar</button>
      <button id="btnLimpiar" class="xbtn btn-secondary" type="button" title="Vaciar todo">🗑 Limpiar</button>
      <button id="sendModal" class="xbtn btn-primary" type="button">Confirmar Devolución</button>
    </div>

    <div id="modalMsg" class="status" style="margin-top:10px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";

  const ENVIOS_TABLE = "Envios a Talleristas";
  const DEVOLUCIONES_TABLE = "Devoluciones Tallerista Cervantes";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const destSC = document.getElementById("destSC");
  const destAnalizar = document.getElementById("destAnalizar");
  const enviar = document.getElementById("enviar");
  const statusEl = document.getElementById("status");
  const nombreTallProv = document.getElementById("nombreTallProv");
  const successBox = document.getElementById("successBox");
  const successCodeEl = document.getElementById("successCode");
  const okBtn = document.getElementById("okBtn");
  const overlay = document.getElementById("overlay");
  const closeModal = document.getElementById("closeModal");
  const cancelModal = document.getElementById("cancelModal");
  const sendModal = document.getElementById("sendModal");
  const linesWrap = document.getElementById("lines");
  const modalMsg = document.getElementById("modalMsg");
  const motivoInput = document.getElementById("motivoInput");
  const fechaInput = document.getElementById("fechaDevolucion");
  const talleristasRow = document.getElementById("talleristasRow");

  fechaInput.value = arDateISO();

  let tallerista = null;
  let destino = null;
  let isSubmitting = false;
  let lastSendCode = null;
  let partesTallerista = [];
  let talleristaButtons = {};
  let talleristasActivos = [];

  function arDateISO(){
    return new Intl.DateTimeFormat("sv-SE", {
      timeZone: "America/Argentina/Buenos_Aires",
      year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
  }

  function genNumericCode(len = 4){
    const min = Math.pow(10, len - 1);
    const max = Math.pow(10, len) - 1;
    return String(Math.floor(min + Math.random() * (max - min + 1)));
  }

  function esc(s){ return String(s == null ? "" : s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }

  // Cargar TODOS los talleristas que recibieron envíos (distinct de Envios a Talleristas).
  // Así cualquier tallerista con envíos puede tener devolución (no solo los rec_cerv).
  async function cargarTalleristas(){
    const PAGE = 1000;
    let from = 0;
    const vistos = new Map(); // claveLower -> nombre original
    while (true){
      const { data, error } = await sb
        .from(ENVIOS_TABLE)
        .select('"Tallerista"')
        .range(from, from + PAGE - 1);
      if (error) throw new Error("Error cargando talleristas: " + error.message);
      if (!data || !data.length) break;
      data.forEach(r => {
        const n = String(r.Tallerista || "").trim();
        if (!n) return;
        const k = n.toLowerCase();
        if (!vistos.has(k)) vistos.set(k, n);
      });
      if (data.length < PAGE) break;
      from += PAGE;
    }
    talleristasActivos = [...vistos.values()].sort((a, b) => a.localeCompare(b, "es"));

    talleristasRow.innerHTML = "";
    talleristaButtons = {};
    talleristasActivos.forEach(nombre => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = nombre;
      btn.onclick = () => selectTallerista(nombre);
      talleristasRow.appendChild(btn);
      talleristaButtons[nombre] = btn;
    });
  }

  // Cargar partes (sectores) distintas que se enviaron a un tallerista.
  // Suma KG y Unidades por sector para detectar en qué UNIDAD se maneja:
  //   - si hubo KG > 0  -> "Kg"  (SP/SC, remaches, etc.)
  //   - si solo Unidades -> "Uni" (cartones, cajas)
  async function cargarPartesEnviadas(nombre){
    const PAGE = 1000;
    let from = 0;
    const sectoresMap = new Map(); // sector -> {sector, desc, kg, uni}

    while (true){
      const { data, error } = await sb
        .from(ENVIOS_TABLE)
        .select('"Sector", "Descripcion", "KG", "Unidades"')
        .eq("Tallerista", nombre)
        .range(from, from + PAGE - 1);
      if (error) throw new Error("Error cargando envíos: " + error.message);
      if (!data || !data.length) break;

      data.forEach(r => {
        const sector = String(r.Sector || "").trim();
        if (!sector) return;
        if (!sectoresMap.has(sector)){
          sectoresMap.set(sector, { sector, desc: String(r.Descripcion || "").trim(), kg: 0, uni: 0 });
        }
        const o = sectoresMap.get(sector);
        if (!o.desc && r.Descripcion) o.desc = String(r.Descripcion).trim();
        o.kg += Number(r.KG) || 0;
        o.uni += Number(r.Unidades) || 0;
      });

      if (data.length < PAGE) break;
      from += PAGE;
    }

    const partes = [];
    sectoresMap.forEach(o => {
      const unidad = (o.kg > 0.0001) ? "Kg" : (o.uni > 0 ? "Uni" : "Kg");
      partes.push({ sector: o.sector, desc: o.desc, unidad });
    });
    partes.sort((a, b) => a.sector.localeCompare(b.sector));
    return partes;
  }

  function selectTallerista(nombre){
    tallerista = nombre;
    partesTallerista = [];

    Object.entries(talleristaButtons).forEach(([k, btn]) => {
      btn.classList.toggle("active", k === nombre);
    });

    destSC.disabled = false;
    destAnalizar.disabled = false;

    nombreTallProv.className = "status";
    nombreTallProv.textContent = "Buscando partes enviadas...";
    statusEl.className = "status bad";
    statusEl.textContent = "Buscando...";
    update();

    cargarPartesEnviadas(nombre).then(partes => {
      partesTallerista = partes;
      if (!partes.length){
        nombreTallProv.className = "status bad";
        nombreTallProv.textContent = "No se encontraron envíos para " + nombre + ".";
      } else {
        nombreTallProv.className = "status ok";
        nombreTallProv.textContent = nombre + ": " + partes.length + " partes encontradas.";
      }
      update();
    }).catch(e => {
      console.error(e);
      nombreTallProv.className = "status bad";
      nombreTallProv.textContent = "Error consultando envíos.";
      update();
    });
  }

  function selectDestino(d){
    destino = d;
    destSC.classList.toggle("active", d === "SC");
    destAnalizar.classList.toggle("active", d === "ANALIZAR");
    update();
  }

  destSC.onclick = () => selectDestino("SC");
  destAnalizar.onclick = () => selectDestino("ANALIZAR");

  function ready(){
    return !isSubmitting && !!tallerista && !!destino && partesTallerista.length > 0;
  }

  function update(){
    const ok = ready();
    enviar.disabled = !ok;
    enviar.classList.toggle("enabled", ok);

    if (ok){
      statusEl.className = "status ok";
      statusEl.textContent = "Listo para cargar devolución.";
    } else if (tallerista && !destino){
      statusEl.className = "status bad";
      statusEl.textContent = "Elegí el destino para continuar.";
    } else if (tallerista && destino && !partesTallerista.length){
      statusEl.className = "status bad";
      statusEl.textContent = "No hay partes enviadas para devolver.";
    } else {
      statusEl.className = "status bad";
      statusEl.textContent = "Seleccioná un nombre para continuar.";
    }
  }

  function showSuccess(code){
    successCodeEl.textContent = code;
    successBox.style.display = "block";
  }

  function hideSuccess(){
    successBox.style.display = "none";
    successCodeEl.textContent = "—";
  }

  function closeModalFn(){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
  }

  function openModalFn(){
    modalMsg.textContent = "";
    modalMsg.className = "status";

    const badge = document.getElementById("modalDestinoBadge");
    if (destino === "SC"){
      badge.textContent = "Vuelve a sector";
      badge.className = "destino-badge sc";
    } else {
      badge.textContent = "Para Analizar";
      badge.className = "destino-badge analizar";
    }

    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
  }

  function resetAll(){
    tallerista = null;
    destino = null;
    partesTallerista = [];

    Object.values(talleristaButtons).forEach(btn => btn.classList.remove("active"));
    destSC.classList.remove("active");
    destAnalizar.classList.remove("active");
    destSC.disabled = true;
    destAnalizar.disabled = true;

    nombreTallProv.textContent = "";
    nombreTallProv.className = "status";
    motivoInput.value = "";

    closeModalFn();
    linesWrap.innerHTML = "";
    modalMsg.textContent = "";
    modalMsg.className = "status";

    isSubmitting = false;
    lastSendCode = null;

    sendModal.disabled = false;
    closeModal.disabled = false;
    cancelModal.disabled = false;

    hideSuccess();
    update();
  }

  okBtn.onclick = () => resetAll();

  function buildModalLines(partes){
    linesWrap.innerHTML = "";

    if (!partes.length){
      const msg = document.createElement("div");
      msg.style.gridColumn = "1 / -1";
      msg.className = "status bad";
      msg.textContent = "No hay partes asociadas.";
      linesWrap.appendChild(msg);
      return;
    }

    partes.forEach((item, i) => {
      const code = document.createElement("input");
      code.type = "text";
      code.value = item.sector;
      code.readOnly = true;
      code.className = "codeRO";
      code.setAttribute("data-role","sector");
      code.setAttribute("data-idx", String(i));

      const esUni = item.unidad === "Uni";

      const kgWrap = document.createElement("div");
      kgWrap.style.cssText = "display:flex;align-items:center;gap:6px";

      const kg = document.createElement("input");
      kg.type = "text";
      kg.inputMode = esUni ? "numeric" : "decimal";
      kg.placeholder = esUni ? "0" : "0.000";
      kg.setAttribute("data-role", "kg");
      kg.setAttribute("data-idx", String(i));
      kg.setAttribute("data-unidad", item.unidad || "Kg");

      kg.addEventListener("input", () => {
        kg.value = esUni ? kg.value.replace(/\D/g, "") : kg.value.replace(/[^\d.]/g, "");
      });

      kg.addEventListener("keydown", (e) => {
        if (e.key === "Enter"){
          e.preventDefault();
          const next = linesWrap.querySelector('input[data-role="kg"][data-idx="' + (i + 1) + '"]');
          if (next) next.focus();
        }
      });

      const unitLbl = document.createElement("span");
      unitLbl.textContent = esUni ? "uni" : "kg";
      unitLbl.style.cssText = "font-weight:800;color:#555;font-size:14px;white-space:nowrap";

      kgWrap.appendChild(kg);
      kgWrap.appendChild(unitLbl);

      const desc = document.createElement("div");
      desc.className = "descCell";
      desc.textContent = item.desc || "";

      linesWrap.appendChild(code);
      linesWrap.appendChild(kgWrap);
      linesWrap.appendChild(desc);
    });

    const first = linesWrap.querySelector('input[data-role="kg"][data-idx="0"]');
    if (first) first.focus();
  }

  function getItemsFromModal(){
    const sectors = Array.from(linesWrap.querySelectorAll('input[data-role="sector"]'));
    return sectors.map((s, i) => {
      const kgEl = linesWrap.querySelector('input[data-role="kg"][data-idx="' + i + '"]');
      const itemBase = partesTallerista[i] || {};
      return {
        sector: String(s.value || "").trim(),
        kg: kgEl ? kgEl.value.trim() : "",
        unidad: itemBase.unidad || "Kg",
        desc: String(itemBase.desc || "").trim()
      };
    });
  }

  function filterItemsToSend(items){
    return items.filter(it => {
      const n = parseFloat(it.kg);
      return it.kg !== "" && !Number.isNaN(n) && n > 0;
    });
  }

  function mostrarConfirmacion(items){
    return new Promise(resolve => {
      let ov = document.getElementById("confirmDevOverlay");
      if (!ov){
        ov = document.createElement("div");
        ov.id = "confirmDevOverlay";
        ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2500;padding:16px";
        ov.innerHTML = '<div style="background:#fff;border-radius:14px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden">'
          + '<div id="confirmDevHeader" style="padding:14px 18px;font-weight:800;font-size:17px;color:#fff"></div>'
          + '<div id="confirmDevBody" style="padding:14px 18px;overflow-y:auto;flex:1"></div>'
          + '<div style="padding:12px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #e5e7eb">'
          + '<button id="confirmDevCancel" type="button" style="background:#fff;color:#111;border:2px solid #d0d7de;border-radius:10px;padding:10px 20px;font-weight:800;cursor:pointer;font-size:15px">Cancelar</button>'
          + '<button id="confirmDevOk" type="button" style="border:0;border-radius:10px;padding:10px 24px;font-weight:800;cursor:pointer;font-size:15px;color:#fff"></button>'
          + '</div></div>';
        document.body.appendChild(ov);
      }

      const header = document.getElementById("confirmDevHeader");
      const okBtnConf = document.getElementById("confirmDevOk");
      if (destino === "SC"){
        header.style.background = "#0a7a2f";
        header.textContent = "Confirmar Devolución — Vuelve a sector";
        okBtnConf.style.background = "#0a7a2f";
        okBtnConf.textContent = "Confirmar Devolución";
      } else {
        header.style.background = "#b42318";
        header.textContent = "Confirmar Devolución — Para Analizar";
        okBtnConf.style.background = "#b42318";
        okBtnConf.textContent = "Confirmar Devolución";
      }

      const totalKg = items.filter(it => it.unidad !== "Uni").reduce((s, it) => s + (parseFloat(it.kg) || 0), 0);
      const totalUni = items.filter(it => it.unidad === "Uni").reduce((s, it) => s + (parseFloat(it.kg) || 0), 0);
      const totalTxt = [totalKg > 0 ? totalKg.toFixed(3) + " kg" : "", totalUni > 0 ? Math.round(totalUni) + " uni" : ""].filter(Boolean).join(" + ");

      const body = document.getElementById("confirmDevBody");
      const rows = items.map(it =>
        '<tr>'
        + '<td style="padding:8px 14px;border:1px solid #d0d7de;text-align:center;white-space:nowrap"><b>' + esc(it.sector) + '</b></td>'
        + '<td style="padding:8px 14px;border:1px solid #d0d7de;text-align:center;white-space:nowrap">' + esc(it.desc || "") + '</td>'
        + '<td style="padding:8px 14px;border:1px solid #d0d7de;text-align:right;white-space:nowrap"><b>' + esc(it.kg) + '</b> ' + (it.unidad === "Uni" ? "uni" : "kg") + '</td>'
        + '</tr>'
      ).join("");

      const motivo = motivoInput.value.trim();
      const motivoHTML = motivo
        ? '<div style="margin-top:12px;padding:10px;background:#f9fafb;border-radius:8px;font-size:14px"><b>Motivo:</b> ' + esc(motivo) + '</div>'
        : '';

      body.innerHTML =
        '<div style="font-weight:700;margin-bottom:10px;color:#555;font-size:15px;text-align:center">'
        + items.length + ' parte' + (items.length > 1 ? 's' : '') + ' de <b style="color:#111">' + esc(tallerista) + '</b>'
        + ' — Total: <b>' + (totalTxt || "0") + '</b></div>'
        + '<div style="display:flex;justify-content:center">'
        + '<table style="width:auto;border-collapse:collapse;font-size:16px;table-layout:auto">'
        + '<thead><tr style="background:#f3f4f6">'
        + '<th style="padding:8px 14px;border:1px solid #d0d7de;text-align:center;font-size:15px">Sector</th>'
        + '<th style="padding:8px 14px;border:1px solid #d0d7de;text-align:center;font-size:15px">Descripción</th>'
        + '<th style="padding:8px 14px;border:1px solid #d0d7de;text-align:center;font-size:15px">Kg</th>'
        + '</tr></thead>'
        + '<tbody>' + rows + '</tbody></table></div>'
        + motivoHTML;

      ov.style.display = "flex";
      const cleanup = () => { ov.style.display = "none"; };
      document.getElementById("confirmDevOk").onclick = () => { cleanup(); resolve(true); };
      document.getElementById("confirmDevCancel").onclick = () => { cleanup(); resolve(false); };
      ov.onclick = (e) => { if (e.target === ov){ cleanup(); resolve(false); } };
    });
  }

  enviar.onclick = async () => {
    if (!ready()) return;
    hideSuccess();

    try {
      enviar.disabled = true;
      enviar.classList.remove("enabled");

      if (!partesTallerista.length){
        statusEl.className = "status bad";
        statusEl.textContent = "No hay partes para devolver.";
        return;
      }

      buildModalLines(partesTallerista);
      openModalFn();
    } catch(e){
      console.error(e);
      statusEl.className = "status bad";
      statusEl.textContent = "Error armando la ventana.";
    } finally {
      enviar.disabled = !ready();
      update();
    }
  };

  closeModal.onclick = () => { if (!isSubmitting) closeModalFn(); };
  cancelModal.onclick = () => { if (!isSubmitting) closeModalFn(); };

  document.getElementById("btnLimpiar").onclick = () => {
    if (isSubmitting) return;
    if (!confirm("¿Vaciar todos los datos cargados?")) return;
    linesWrap.querySelectorAll('input[data-role="kg"]').forEach(inp => { inp.value = ""; });
    modalMsg.textContent = "";
  };

  overlay.addEventListener("click", (e) => {
    if (!isSubmitting && e.target === overlay) closeModalFn();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlay.classList.contains("open") && !isSubmitting) closeModalFn();
  });

  sendModal.onclick = async () => {
    if (isSubmitting) return;

    if (!partesTallerista.length){
      modalMsg.className = "status bad";
      modalMsg.textContent = "No hay partes para enviar.";
      return;
    }

    const rawItems = getItemsFromModal();
    const items = filterItemsToSend(rawItems);

    if (items.length === 0){
      modalMsg.className = "status bad";
      modalMsg.textContent = "Completá al menos un Kg (> 0).";
      return;
    }

    const ok = await mostrarConfirmacion(items);
    if (!ok) return;

    lastSendCode = genNumericCode(4);
    const fechaSeleccionada = fechaInput.value || arDateISO();
    const motivo = motivoInput.value.trim() || null;

    try {
      isSubmitting = true;
      sendModal.disabled = true;
      closeModal.disabled = true;
      cancelModal.disabled = true;
      update();

      modalMsg.className = "status";
      modalMsg.textContent = "Guardando...";

      // Detectar tipo de sector (SP vs SC) una sola vez — para guardar el destino REAL
      // (SP/SC) por item cuando "vuelve a sector", y para el ajuste de "analizar".
      const [spRes, scRes] = await Promise.all([
        sb.from("SP Kg").select('"Sp"'),
        sb.from("SC Kg").select('"SC"')
      ]);
      const spSet = new Set((spRes.data || []).map(r => String(r.Sp || "").trim()));
      const scSet = new Set((scRes.data || []).map(r => String(r.SC || "").trim()));
      const tipoSector = (sec) => spSet.has(sec) ? "SP" : (scSet.has(sec) ? "SC" : "SC");

      const registros = items.map(it => {
        const sec = String(it.sector || "").trim();
        return {
          "Fecha": fechaSeleccionada,
          "Nombre_Tall": tallerista,
          "Codigo_Tall": "",
          "Sector": sec,
          "Descripcion": String(it.desc || "").trim(),
          "Kg": parseFloat(it.kg) || 0,
          // destino: si vuelve a sector, guardamos el tipo real (SP/SC) del sector;
          //          si es analizar, "ANALIZAR".
          "destino": destino === "ANALIZAR" ? "ANALIZAR" : tipoSector(sec),
          "motivo": motivo,
          "codigo_devolucion": lastSendCode
        };
      });

      const { error: sbErr } = await sb.from(DEVOLUCIONES_TABLE).insert(registros);
      if (sbErr) throw new Error("Error guardando: " + sbErr.message);

      // === CIRCUITO DE STOCK ===
      // (1) Resta del tallerista + suma al sector (SP o SC): fila NEGATIVA en Envios a Talleristas.
      //     StockSP y StockSC restan los envios en su formula (online = ... - enviosTall), asi que
      //     una fila negativa baja el online del tallerista (Control Tall) y recompone el online del
      //     sector que corresponda automaticamente — sin tocar SP Kg / SC Kg a mano.
      const dia = fechaSeleccionada.slice(8, 10) + "/" + fechaSeleccionada.slice(5, 7); // YYYY-MM-DD -> DD/MM
      const negRows = items
        .filter(it => (parseFloat(it.kg) || 0) > 0)
        .map(it => {
          const cant = parseFloat(it.kg) || 0;
          const esUni = it.unidad === "Uni";
          return {
            "Tallerista": tallerista,
            "Sector": String(it.sector || "").trim(),
            "Descripcion": String(it.desc || "").trim(),
            "KG": esUni ? 0 : -cant,
            "Cajones": 0,
            "Unidades": esUni ? -Math.round(cant) : 0,
            "Dia-mes": dia,
            "Faltante": false
          };
        });
      if (negRows.length){
        const { error: negErr } = await sb.from(ENVIOS_TABLE).insert(negRows);
        if (negErr) throw new Error("Error descontando del tallerista: " + negErr.message);
      }

      // (2) "Para Analizar": el material NO debe quedar en el stock del sector. Como la fila negativa
      //     lo acredita al sector (via formula), lo compensamos descontando ese kg del Stock Inicial
      //     del sector correspondiente (SP o SC) -> neto al sector = 0, pero igual se descuenta del tallerista.
      if (destino === "ANALIZAR"){
        for (const it of items){
          const kg = parseFloat(it.kg) || 0;
          if (kg <= 0) continue;
          const sec = String(it.sector || "").trim();
          if (spSet.has(sec)){
            const { data } = await sb.from("SP Kg").select('"Stock Inicial"').eq("Sp", sec).maybeSingle();
            if (data) await sb.from("SP Kg").update({ "Stock Inicial": Number(data["Stock Inicial"] || 0) - kg }).eq("Sp", sec);
          } else if (scSet.has(sec)){
            const { data } = await sb.from("SC Kg").select('"Stock Inicial"').eq("SC", sec).maybeSingle();
            if (data) await sb.from("SC Kg").update({ "Stock Inicial": Number(data["Stock Inicial"] || 0) - kg }).eq("SC", sec);
          }
        }
      }

      isSubmitting = false;
      sendModal.disabled = false;
      closeModal.disabled = false;
      cancelModal.disabled = false;
      update();

      modalMsg.className = "status ok";
      modalMsg.textContent = "Devolución guardada.";
      statusEl.className = "status ok";
      statusEl.textContent = "Devolución registrada.";

      closeModalFn();
      if (lastSendCode) showSuccess(lastSendCode);

    } catch(e){
      isSubmitting = false;
      sendModal.disabled = false;
      closeModal.disabled = false;
      cancelModal.disabled = false;
      update();

      modalMsg.className = "status bad";
      modalMsg.textContent = "Error: " + (e?.message || e);
    }
  };

  cargarTalleristas()
    .then(() => update())
    .catch(err => {
      console.error(err);
      statusEl.className = "status bad";
      statusEl.textContent = "Error cargando talleristas.";
    });
</script>
</body>
</html>

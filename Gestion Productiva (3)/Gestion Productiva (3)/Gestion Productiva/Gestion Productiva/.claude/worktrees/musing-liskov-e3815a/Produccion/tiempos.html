<!doctype html>
<html lang="es">
<head>
  <script src="../auth-guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiempos Matrices</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #d9d9de; padding: 20px; min-height: 100vh;
    }

    .top-bar {
      max-width: 880px; margin: 0 auto 20px;
      display: flex; align-items: center; gap: 14px;
      transition: max-width .2s;
    }
    .btn-volver {
      height: 40px; padding: 0 20px; border-radius: 999px;
      border: 2px solid #b9b9b9; background: #f7f7f7;
      font-size: 14px; cursor: pointer; font-weight: 700;
    }
    .btn-volver:hover { background: #e5e5e5; border-color: #7f7f7f; }
    .top-bar h1 { font-size: 22px; flex: 1; color: #1e293b; }

    .main-card {
      margin: 0 auto 20px;
      background: #fff; border: 1px solid #cfcfcf;
      transition: max-width .2s;
      border-radius: 14px; overflow: hidden;
    }
    .card-header {
      background: #111; color: #fff; padding: 16px 22px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-header h2 { font-size: 17px; color: #fff; margin: 0; }
    .card-body { padding: 22px; }

    /* CONTROLES */
    .controls-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; margin-bottom: 16px;
    }
    .search-input {
      height: 38px; padding: 0 10px; border: 1.5px solid #cbd5e1; border-radius: 10px;
      font-size: 13px; font-family: inherit; width: 150px; min-width: 0;
    }
    .search-input:focus { border-color: #3b82f6; outline: none; }
    .filter-btn {
      height: 38px; padding: 0 10px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      background: #f8fafc; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      font-family: inherit; color: #64748b; transition: all .15s;
    }
    .filter-btn.active { background: #111; color: #fff; border-color: #111; }
    .filter-btn:hover:not(.active) { border-color: #94a3b8; }
    .btn-excel {
      height: 38px; padding: 0 12px; border: 1.5px solid #16a34a; border-radius: 10px;
      background: #f0fdf4; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
      font-family: inherit; color: #16a34a; transition: all .15s;
    }
    .btn-excel:hover { background: #16a34a; color: #fff; }
    .stats-badge {
      margin-left: auto; font-size: 13px; color: #64748b; font-weight: 500;
    }

    /* TABLA */
    .table-wrap {
      max-height: 72vh; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 10px;
    }
    .table-wrap::-webkit-scrollbar { width: 8px; }
    .table-wrap::-webkit-scrollbar-track { background: #f1f5f9; }
    .table-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    thead th {
      background: #f1f5f9; text-align: left; padding: 8px 10px;
      font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;
      letter-spacing: .3px; border-bottom: 2px solid #e5e7eb;
      position: sticky; top: 0; z-index: 2; cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: #1e293b; }
    thead th .sort-arrow { font-size: 9px; margin-left: 3px; color: #94a3b8; }
    thead th.sorted .sort-arrow { color: #111; }
    tbody td {
      padding: 7px 10px; border-bottom: 1px solid #f0f0f0; color: #334155; font-size: 12px;
    }
    tbody tr:hover { background: #f8fafc; cursor: pointer; }
    tbody td:nth-child(2), thead th:nth-child(2) { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tbody td, thead th { white-space: nowrap; }
    .num { text-align: center; font-variant-numeric: tabular-nums; }
    .clickable { color: #3b82f6; font-weight: 700; cursor: pointer; text-decoration: underline; }
    .clickable:hover { color: #1d4ed8; }
    .sin-tiempo { color: #dc2626; font-weight: 600; }
    .diff-pos { color: #16a34a; }
    .diff-neg { color: #dc2626; }

    /* EDICION INLINE T.HIST */
    .editable-hist {
      cursor: pointer; position: relative;
      border-bottom: 1.5px dashed #94a3b8; padding-bottom: 1px;
    }
    .editable-hist:hover { border-bottom-color: #3b82f6; color: #3b82f6; }
    .edit-input-hist {
      width: 70px; height: 28px; border: 2px solid #3b82f6; border-radius: 6px;
      font-size: 12px; font-family: inherit; text-align: center; outline: none;
      font-variant-numeric: tabular-nums; background: #eff6ff;
    }
    .edit-input-hist:focus { box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
    .toast-t {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #111; color: #fff; padding: 12px 28px; border-radius: 12px;
      font-size: 14px; font-weight: 600; z-index: 999;
      box-shadow: 0 6px 24px rgba(0,0,0,.25);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast-t.show { opacity: 1; }

    /* DATE FILTERS */
    .date-row {
      display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap;
    }
    .date-group { display: flex; align-items: center; gap: 5px; }
    .date-group label { font-size: 12px; font-weight: 600; color: #64748b; }
    .date-input {
      height: 36px; padding: 0 10px; border: 1.5px solid #cbd5e1; border-radius: 10px;
      font-size: 13px; font-family: inherit; width: 145px;
    }
    .date-input:focus { border-color: #3b82f6; outline: none; }
    .btn-limpiar-fechas {
      height: 36px; padding: 0 12px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      background: #f8fafc; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; color: #64748b; transition: all .15s;
    }
    .btn-limpiar-fechas:hover { border-color: #94a3b8; background: #e2e8f0; }

    /* LOADING */
    .loading-msg { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }

    /* POPUP */
    .overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 100; justify-content: center; align-items: center;
    }
    .overlay.visible { display: flex; }
    .popup {
      background: #fff; border-radius: 16px; width: 90%; max-width: 820px;
      max-height: 85vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .popup-header {
      padding: 18px 22px; border-bottom: 1px solid #e5e7eb;
      display: flex; justify-content: space-between; align-items: center;
    }
    .popup-header h3 { font-size: 16px; font-weight: 800; color: #111; }
    .popup-header .close-btn {
      width: 32px; height: 32px; border: none; background: #f1f5f9;
      border-radius: 8px; font-size: 18px; cursor: pointer; color: #64748b;
      display: flex; align-items: center; justify-content: center;
    }
    .popup-header .close-btn:hover { background: #e2e8f0; }
    .popup-stats {
      padding: 12px 22px; background: #f8fafc; border-bottom: 1px solid #e5e7eb;
      display: flex; gap: 20px; font-size: 13px; color: #64748b; font-weight: 500;
    }
    .popup-stats strong { color: #111; }
    .popup-body {
      flex: 1; overflow-y: auto; padding: 0;
    }
    .popup-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .popup-table th {
      background: #f1f5f9; text-align: left; padding: 8px 14px;
      font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;
      border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 1;
    }
    .popup-table td {
      padding: 8px 14px; border-bottom: 1px solid #f0f0f0; color: #334155;
    }
    .popup-table tr:hover { background: #f8fafc; }
    .popup-table tr.anulado { opacity: .45; text-decoration: line-through; }
    .eye-btn {
      width: 30px; height: 30px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 16px; display: inline-flex;
      align-items: center; justify-content: center; transition: all .15s;
    }
    .eye-btn.active { background: #f0fdf4; color: #16a34a; }
    .eye-btn.inactive { background: #fef2f2; color: #dc2626; }
    .eye-btn:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-volver" onclick="location.href='../Inicio/'">&larr; Volver</button>
    <h1>Tiempos de Matrices</h1>
  </div>

  <div class="main-card">
    <div class="card-header">
      <h2>Comparativa Tiempo Historico vs Real</h2>
    </div>
    <div class="card-body">

      <div class="date-row">
        <div class="date-group">
          <label>Desde</label>
          <input type="date" class="date-input" id="fechaDesde" />
        </div>
        <div class="date-group">
          <label>Hasta</label>
          <input type="date" class="date-input" id="fechaHasta" />
        </div>
        <button class="btn-limpiar-fechas" id="btnLimpiarFechas">Limpiar (todo)</button>
      </div>

      <div class="controls-row">
        <input class="search-input" id="searchInput" placeholder="Buscar por N° o nombre..." />
        <button class="filter-btn active" data-filter="todas">Todas</button>
        <button class="filter-btn" data-filter="con">Con Tiempo</button>
        <button class="filter-btn" data-filter="sin">Sin Tiempo</button>
        <button class="filter-btn" data-filter="sinConReg">Sin Tiempo c/ Reg</button>
        <button class="btn-excel" id="btnExcel">&#128196; Excel</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;user-select:none"><input type="checkbox" id="chkOperarios"> Operarios</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;user-select:none"><input type="checkbox" id="chkHistoricos"> Historicos</label>
        <span class="stats-badge" id="statsBadge"></span>
      </div>

      <div class="table-wrap">
        <table style="table-layout:auto">
          <colgroup>
            <col>
            <col style="max-width:140px">
            <col><col><col><col><col><col><col>
          </colgroup>
          <thead>
            <tr>
              <th data-col="num">N° <span class="sort-arrow">▲</span></th>
              <th data-col="nombre">Nombre <span class="sort-arrow">▲</span></th>
              <th data-col="historico" class="num">T.Hist <span class="sort-arrow">▲</span></th>
              <th data-col="promReal" class="num">Prom <span class="sort-arrow">▲</span></th>
              <th data-col="ptje" class="num">Ptje <span class="sort-arrow">▲</span></th>
              <th data-col="min" class="num">Min <span class="sort-arrow">▲</span></th>
              <th data-col="max" class="num">Max <span class="sort-arrow">▲</span></th>
              <th data-col="registros" class="num">Reg <span class="sort-arrow">▲</span></th>

          <tbody id="tbody"></tbody>

      <div class="loading-msg" id="loadingMsg">Cargando datos...</div>

    </div>
  </div>

  <!-- POPUP REGISTROS -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="popup-header">
        <h3 id="popupTitle">Registros</h3>
        <button class="close-btn" id="closePopup">&times;</button>
      </div>
      <div class="popup-stats" id="popupStats"></div>
      <div class="popup-body">
        <table class="popup-table">
          <thead>
            <tr>
              <th data-pcol="fecha" style="cursor:pointer">Fecha <span class="ps-arrow">▲</span></th>
              <th data-pcol="operario" style="cursor:pointer">Operario <span class="ps-arrow">▲</span></th>
              <th data-pcol="uni" class="num" style="cursor:pointer">Uni <span class="ps-arrow">▲</span></th>
              <th data-pcol="seg" class="num" style="cursor:pointer">Seg Trab <span class="ps-arrow">▲</span></th>
              <th data-pcol="toma" class="num" style="cursor:pointer">T. Toma <span class="ps-arrow">▲</span></th>
              <th data-pcol="ptje" class="num" style="cursor:pointer">Ptje <span class="ps-arrow">▲</span></th>
              <th>Anular</th>
            </tr>
          </thead>
          <tbody id="popupBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<div id="toastT" class="toast-t"></div>

<script>
"use strict";

const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let matrices = [];      // { N_Matriz, Matriz, Tiempo_Historico }
let allRegistros = [];  // todos los registros sin filtro de fecha
let historicosCache = null; // registros historicos (carga lazy)
let registros = [];     // db_n8n_espejo rows (filtrados por fecha)
let empleadosMap = {};  // legajo → nombre
let matData = [];       // computed rows for the table
let currentSort = { col: "num", asc: true };
let currentFilter = "todas";
let popupSort = { col: "distHist", asc: false };
let currentPopupRow = null;

const tbody = document.getElementById("tbody");
const loadingMsg = document.getElementById("loadingMsg");
const searchInput = document.getElementById("searchInput");
const statsBadge = document.getElementById("statsBadge");
const chkOperarios = document.getElementById("chkOperarios");
const chkHistoricos = document.getElementById("chkHistoricos");
const overlay = document.getElementById("overlay");
const popupTitle = document.getElementById("popupTitle");
const popupStats = document.getElementById("popupStats");
const popupBody = document.getElementById("popupBody");

/* ===== LOAD ===== */
(async function init() {
  const [matRes, empRes] = await Promise.all([
    sb.from("Matrices").select("*"),
    sb.from("Empleados").select("Legajo, Empleado")
  ]);

  // Paginar db_n8n_espejo (limite 1000 por request)
  const allRegs = [];
  const PAGE = 1000;
  let from = 0;
  while (true) {
    const { data, error } = await sb.from("db_n8n_espejo")
      .select("id, Matriz, Nombre_Matriz, Legajo, Uni, Fecha, Segundos_Trabajados, Segundos_Tiempo_Muerto, Anular_Tiempo, Eliminar, Premio, Tiempo_Toma")
      .or("Eliminar.is.null,Eliminar.neq.S")
      .neq("Legajo", "1")
      .range(from, from + PAGE - 1);
    if (error || !data || !data.length) break;
    allRegs.push(...data);
    if (data.length < PAGE) break;
    from += PAGE;
  }

  matrices = matRes.data || [];
  allRegistros = allRegs;
  (empRes.data || []).forEach(e => {
    empleadosMap[String(e.Legajo || "").trim()] = e.Empleado || "";
  });

  // Fechas default: inicio del mes actual → hoy
  const hoy = new Date();
  document.getElementById("fechaHasta").value = hoy.toISOString().slice(0, 10);
  document.getElementById("fechaDesde").value = "2020-01-01";

  filtrarPorFecha();
  loadingMsg.style.display = "none";

  // Listeners fechas
  document.getElementById("fechaDesde").addEventListener("change", filtrarPorFecha);
  document.getElementById("fechaHasta").addEventListener("change", filtrarPorFecha);
  document.getElementById("btnLimpiarFechas").addEventListener("click", () => {
    document.getElementById("fechaDesde").value = "";
    document.getElementById("fechaHasta").value = "";
    filtrarPorFecha();
  });
})();

function filtrarPorFecha() {
  const desde = document.getElementById("fechaDesde").value;
  const hasta = document.getElementById("fechaHasta").value;
  const filtrarFecha = (arr) => {
    if (!desde || !hasta) return arr;
    const desdeD = new Date(desde + "T00:00:00-03:00");
    const hastaD = new Date(hasta + "T23:59:59-03:00");
    return arr.filter(r => {
      const f = new Date(r.Fecha);
      return f >= desdeD && f <= hastaD;
    });
  };
  let base = filtrarFecha(allRegistros);
  if (chkHistoricos.checked && historicosCache) {
    registros = [...base, ...filtrarFecha(historicosCache)];
  } else {
    registros = base;
  }
  computeMatData();
  renderTable();
}

function computeMatData() {
  matData = matrices.map(m => {
    const nMat = String(m.N_Matriz || "").trim();
    const nombre = m.Matriz || "";
    const tHist = Number(m.Tiempo_Historico || 0);

    // Filter registros for this matrix that are not anulados
    const regs = registros.filter(r =>
      String(r.Matriz || "").trim() === nMat
    );
    const activeRegs = regs.filter(r => !r.Anular_Tiempo);

    let promReal = 0, min = 0, max = 0;
    if (activeRegs.length > 0) {
      const tiempos = activeRegs.map(r => {
        if (r.Tiempo_Toma != null && Number(r.Tiempo_Toma) > 0) return Number(r.Tiempo_Toma);
        const uni = Number(r.Uni || 1) || 1;
        const seg = Number(r.Segundos_Trabajados || 0);
        return seg / uni;
      });
      const sum = tiempos.reduce((a, b) => a + b, 0);
      promReal = sum / tiempos.length;
      min = Math.min(...tiempos);
      max = Math.max(...tiempos);
    }

    const diff = tHist > 0 && activeRegs.length > 0 ? promReal - tHist : null;

    let ptje = null;
    if (activeRegs.length > 0 && tHist > 0) {
      const premios = activeRegs.map(r => Number(r.Premio || 0));
      ptje = premios.reduce((a, b) => a + b, 0) / premios.length;
    }

    return {
      matId: m.id,
      num: parseInt(nMat) || 0,
      numSort: (parseInt(nMat) || 0) + (nMat.replace(/[0-9]/g, "") || ""),
      numStr: nMat,
      nombre,
      historico: tHist,
      promReal: activeRegs.length > 0 ? promReal : null,
      diff,
      ptje,
      min: activeRegs.length > 0 ? min : null,
      max: activeRegs.length > 0 ? max : null,
      registros: regs.length,
      activeCount: activeRegs.length,
      regs
    };
  });
}

function fmtSeg(s) {
  if (s == null) return "-";
  return s.toFixed(1);
}

function hayFiltroFechaActivo() {
  return !!(document.getElementById("fechaDesde").value && document.getElementById("fechaHasta").value);
}

function renderTable() {
  const q = searchInput.value.trim().toLowerCase();
  const conFecha = hayFiltroFechaActivo();

  const hasComma = q.includes(",");
  const terms = hasComma ? q.split(",").map(t => t.trim()).filter(t => t) : (q ? [q] : []);
  let filtered = matData.filter(r => {
    if (conFecha && r.registros === 0) return false;
    if (currentFilter === "con" && r.historico <= 0) return false;
    if (currentFilter === "sin" && r.historico > 0) return false;
    if (currentFilter === "sinConReg" && (r.historico > 0 || r.registros === 0)) return false;
    if (terms.length) {
      if (hasComma) { if (!terms.some(t => r.numStr === t)) return false; }
      else { if (!r.numStr.includes(q) && !r.nombre.toLowerCase().includes(q)) return false; }
    }
    return true;
  });

  // sort
  filtered.sort((a, b) => {
    const col = currentSort.col;
    let va, vb;
    if (col === "num") {
      // Sort numérico primero, luego sufijo alfanumérico
      const na = a.num, nb = b.num;
      if (na !== nb) return currentSort.asc ? na - nb : nb - na;
      const sa = a.numStr, sb = b.numStr;
      return currentSort.asc ? sa.localeCompare(sb) : sb.localeCompare(sa);
    }
    va = a[col]; vb = b[col];
    if (va == null) va = currentSort.asc ? Infinity : -Infinity;
    if (vb == null) vb = currentSort.asc ? Infinity : -Infinity;
    if (typeof va === "string") {
      va = va.toLowerCase(); vb = (vb || "").toLowerCase();
      return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return currentSort.asc ? va - vb : vb - va;
  });

  const hidePtje = currentFilter === "sin" || currentFilter === "sinConReg";
  document.querySelectorAll(".table-wrap thead th[data-col='ptje']").forEach(th => {
    th.style.display = hidePtje ? "none" : "";
  });
  document.querySelector(".main-card").style.maxWidth = hidePtje ? "680px" : "820px";
  document.querySelector(".top-bar").style.maxWidth = hidePtje ? "680px" : "820px";

  statsBadge.textContent = `${filtered.length} de ${matData.length} matrices`;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + (hidePtje ? 7 : 8) + '" style="text-align:center;padding:30px;color:#94a3b8">Sin resultados</td></tr>';
    return;
  }

  const showOps = chkOperarios.checked;

  tbody.innerHTML = filtered.map(r => {
    const histClass = r.historico <= 0 ? ' class="sin-tiempo"' : '';
    let ptjeHtml = "-";
    if (r.ptje != null) {
      const cls2 = r.ptje > 0 ? "diff-pos" : r.ptje < 0 ? "diff-neg" : "";
      const sign2 = r.ptje > 0 ? "+" : "";
      ptjeHtml = `<span class="${cls2}">${sign2}${r.ptje.toFixed(2)}</span>`;
    }
    const opCols = '';
    let mainRow = `<tr>
      <td class="clickable" data-mat="${r.numStr}">${r.numStr}</td>
      <td>${r.nombre}</td>
      <td class="num editable-hist" data-matid="${r.matId}" data-nmat="${r.numStr}" title="Click para editar"${histClass}>${r.historico > 0 ? r.historico.toFixed(1) : "Sin tiempo"}</td>
      <td class="num">${fmtSeg(r.promReal)}</td>
      <td class="num"${hidePtje ? ' style="display:none"' : ''}>${ptjeHtml}</td>
      <td class="num">${fmtSeg(r.min)}</td>
      <td class="num">${fmtSeg(r.max)}</td>
      <td class="num">${r.activeCount} / ${r.registros}</td>
    </tr>`;

    if (showOps && r.activeCount > 0) {
      const activeRegs = r.regs.filter(reg => !reg.Anular_Tiempo);
      const byEmp = new Map();
      activeRegs.forEach(reg => {
        const leg = String(reg.Legajo || "").trim();
        if (leg === "1") return;
        if (!byEmp.has(leg)) byEmp.set(leg, []);
        const tt = (reg.Tiempo_Toma != null && Number(reg.Tiempo_Toma) > 0) ? Number(reg.Tiempo_Toma) : (Number(reg.Segundos_Trabajados || 0) / (Number(reg.Uni || 1) || 1));
        byEmp.get(leg).push(tt);
      });
      byEmp.forEach((tiempos, leg) => {
        const nombre = empleadosMap[leg] || leg;
        const prom = tiempos.reduce((a, b) => a + b, 0) / tiempos.length;
        const mn = Math.min(...tiempos);
        const mx = Math.max(...tiempos);
        mainRow += `<tr style="background:#f8f9fb;font-size:13px;color:#555">
          <td></td>
          <td style="padding-left:20px">↳ ${nombre}</td>
          <td class="num"></td>
          <td class="num">${prom.toFixed(1)}</td>
          <td class="num"${hidePtje ? ' style="display:none"' : ''}></td>
          <td class="num">${mn.toFixed(1)}</td>
          <td class="num">${mx.toFixed(1)}</td>
          <td class="num">${tiempos.length}</td>
        </tr>`;
      });
    }

    return mainRow;
  }).join("");
}

/* ===== EXCEL ===== */
function buildHtmlExcel(sheetTitle, headers, rows) {
  var S = "<", E = ">", C = S + "/";
  var h = S + 'html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:spreadsheet"' + E;
  h += S + 'head' + E + S + 'meta charset="utf-8"' + E + S + 'style' + E;
  h += 'td, th { border: 1px solid #333; padding: 4px 8px; font-family: Calibri; font-size: 14pt; text-align: center; }';
  h += 'th { font-size: 16pt; font-weight: bold; }';
  h += '.title { font-size: 18pt; font-weight: bold; border: 1px solid #333; }';
  h += C + 'style' + E + C + 'head' + E + S + 'body' + E;
  h += S + 'table' + E;
  h += S + 'tr' + E + S + 'td class="title" colspan="' + headers.length + '"' + E + sheetTitle + C + 'td' + E + C + 'tr' + E;
  h += S + 'tr' + E;
  headers.forEach(function(hdr) { h += S + 'th' + E + hdr + C + 'th' + E; });
  h += C + 'tr' + E;
  rows.forEach(function(row) {
    if (row && row[0] === "__SEP__") {
      h += S + 'tr style="height:10px"' + E + S + 'td colspan="' + headers.length + '" style="border:none;padding:0;height:10px;background:#fff"' + E + C + 'td' + E + C + 'tr' + E;
      return;
    }
    h += S + 'tr' + E;
    row.forEach(function(val) { h += S + 'td' + E + (val !== "" && val != null ? val : "") + C + 'td' + E; });
    h += C + 'tr' + E;
  });
  h += C + 'table' + E + C + 'body' + E + C + 'html' + E;
  return h;
}

function excelTimestamp() {
  var now = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Argentina/Buenos_Aires" }));
  var dd = String(now.getDate()).padStart(2,"0"), mm = String(now.getMonth()+1).padStart(2,"0"), yy = String(now.getFullYear()).slice(-2);
  var hh = String(now.getHours()).padStart(2,"0"), mi = String(now.getMinutes()).padStart(2,"0");
  return dd + "-" + mm + "-" + yy + "_" + hh + mi;
}

document.getElementById("btnExcel").addEventListener("click", () => {
  const q = searchInput.value.trim().toLowerCase();
  const exHasComma = q.includes(",");
  const exTerms = exHasComma ? q.split(",").map(t => t.trim()).filter(t => t) : (q ? [q] : []);
  let filtered = matData.filter(r => {
    if (currentFilter === "con" && r.historico <= 0) return false;
    if (currentFilter === "sin" && r.historico > 0) return false;
    if (currentFilter === "sinConReg" && (r.historico > 0 || r.registros === 0)) return false;
    if (exTerms.length) {
      if (exHasComma) { if (!exTerms.some(t => r.numStr === t)) return false; }
      else { if (!r.numStr.includes(q) && !r.nombre.toLowerCase().includes(q)) return false; }
    }
    return true;
  });
  filtered.sort((a, b) => {
    let va = a[currentSort.col], vb = b[currentSort.col];
    if (va == null) va = currentSort.asc ? Infinity : -Infinity;
    if (vb == null) vb = currentSort.asc ? Infinity : -Infinity;
    if (typeof va === "string") {
      va = va.toLowerCase(); vb = (vb || "").toLowerCase();
      return currentSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return currentSort.asc ? va - vb : vb - va;
  });

  const exHideDP = currentFilter === "sin" || currentFilter === "sinConReg";
  const filterLabels = { todas: "Matrices - Todas", con: "Matrices - Con Tiempo", sin: "Matrices - Sin Tiempo", sinConReg: "Matrices S/Tiempo y C/ Registros" };

  /* --- sinConReg: una sola hoja con resumen + detalle por matriz --- */

      ]);
    });

    // Por cada matriz con registros
    sortedMats.forEach(function(mat) {
      var activeRegs = mat.regs.filter(function(r) { return !r.Anular_Tiempo; });
      if (activeRegs.length === 0) return;
      activeRegs.sort(function(a, b) { return Number(a.Tiempo_Toma || 0) - Number(b.Tiempo_Toma || 0); });

      // 2 filas vacías de separación

      allRows.push(["", "", "", "", "", ""]);
      // Titulo matriz
      allRows.push(["Matriz " + mat.numStr + " - " + mat.nombre, "", "", "", "", ""]);
      allRows.push(["Fecha", "Operario", "Uni", "Seg Trab", "T. Toma", "Ptje"]);

      var sumToma = 0;
      activeRegs.forEach(function(r) {
        var leg = String(r.Legajo || "").trim();
        var tToma = r.Tiempo_Toma != null && Number(r.Tiempo_Toma) > 0
          ? Number(r.Tiempo_Toma)
          : (Number(r.Uni || 1) > 0 ? Number(r.Segundos_Trabajados || 0) / Number(r.Uni) : 0);
        sumToma += tToma;
        allRows.push([
          r.Fecha ? new Date(r.Fecha).toLocaleDateString("es-AR") : "",

          Number(r.Uni || 0),
          Number(r.Segundos_Trabajados || 0),
          tToma.toFixed(2),

      });
      // Prom Real
      var promReal = activeRegs.length > 0 ? (sumToma / activeRegs.length).toFixed(2) : "0";
      allRows.push(["", "", "", "", "Prom Real:", promReal]);
    });

    // Construir HTML Excel
    var S = "<", E = ">", CC = S + "/";
    var xh = S + 'html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:spreadsheet"' + E;
    xh += S + 'head' + E + S + 'meta charset="utf-8"' + E + S + 'style' + E;

    xh += '.sep td { border: none; }';
    xh += CC + 'style' + E + CC + 'head' + E + S + 'body' + E + S + 'table' + E;

    allRows.forEach(function(row, idx) {
      // Detectar tipo de fila
      var isTitle = idx === 0 || (row[0] && String(row[0]).startsWith("Matriz ") && row[1] === "" && row[2] === "");
      var isHeader = (idx === 1) || (row[0] === "Fecha" && row[1] === "Operario");
      var isSep = row[0] === "" && row[1] === "" && row[2] === "" && row[3] === "" && row[4] === "" && row[5] === "";

      if (isSep) {

        xh += S + 'td colspan="4"' + E + CC + 'td' + E;
        xh += S + 'td class="lbl"' + E + row[4] + CC + 'td' + E;
        xh += S + 'td class="res"' + E + row[5] + CC + 'td' + E;
        xh += CC + 'tr' + E;
      } else {
        xh += S + 'tr' + E;
        row.forEach(function(val) { xh += S + 'td' + E + (val !== "" && val != null ? val : "") + CC + 'td' + E; });
        xh += CC + 'tr' + E;
      }
    });

    xh += CC + 'table' + E + CC + 'body' + E + CC + 'html' + E;
    var blob = new Blob([xh], { type: 'application/vnd.ms-excel;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");

    a.download = "Matrices_SinTiempo_ConReg_" + ts + ".xls";
    a.click();
    URL.revokeObjectURL(url);
    return;
  }

  /* --- HTML Excel simple (1 hoja) --- */
  let headers, rows;
  if (exHideDP) {
    headers = ["N° Mtrz", "Nombre", "Prom Real", "Prom Min", "Prom Max"];
    rows = filtered.map(r => [
      r.numStr,

      r.promReal != null ? +r.promReal.toFixed(1) : "",

  } else {

    headers = ["N° Mtrz", "Nombre", "T. Hist", "Prom Real", "Ptje", "Min", "Max", "Reg"];

      const base = [

        r.historico > 0 ? +r.historico.toFixed(1) : 0,
        r.promReal != null ? +r.promReal.toFixed(1) : "",
        r.ptje != null ? +r.ptje.toFixed(2) : "",
        r.min != null ? +r.min.toFixed(1) : "",
        r.max != null ? +r.max.toFixed(1) : ""
      ];
      rows.push([...base, r.activeCount]);
      if (exOps && r.activeCount > 0) {
        const activeRegs = r.regs.filter(reg => !reg.Anular_Tiempo);
        const byEmp = new Map();
        activeRegs.forEach(reg => {
          const leg = String(reg.Legajo || "").trim();
          if (leg === "1") return;
          if (!byEmp.has(leg)) byEmp.set(leg, []);
          const tt = (reg.Tiempo_Toma != null && Number(reg.Tiempo_Toma) > 0) ? Number(reg.Tiempo_Toma) : (Number(reg.Segundos_Trabajados || 0) / (Number(reg.Uni || 1) || 1));
          byEmp.get(leg).push(tt);

tbody.addEventListener("click", e => {

function openPopup(row) {
  currentPopupRow = row;
  popupSort = { col: "distHist", asc: false };
  popupTitle.textContent = `Matriz ${row.numStr} — ${row.nombre}`;
  updatePopupStats(row);
  renderPopupRows(row);
  updatePopupArrows();
  overlay.classList.add("visible");
}

function updatePopupStats(row) {
  const activeRegs = row.regs.filter(r => !r.Anular_Tiempo);
  let promReal = 0;
  if (activeRegs.length > 0) {
    const tiempos = activeRegs.map(r => {
      if (r.Tiempo_Toma != null && Number(r.Tiempo_Toma) > 0) return Number(r.Tiempo_Toma);
      const uni = Number(r.Uni || 1) || 1;
      return Number(r.Segundos_Trabajados || 0) / uni;
    });
    promReal = tiempos.reduce((a, b) => a + b, 0) / tiempos.length;
  }
  popupStats.innerHTML =
    `<span>T. Historico: <strong>${row.historico > 0 ? row.historico.toFixed(1) + "s" : "Sin tiempo"}</strong></span>` +
    `<span>Prom Real: <strong>${activeRegs.length > 0 ? promReal.toFixed(1) + "s" : "-"}</strong></span>` +
    `<span>Registros activos: <strong>${activeRegs.length} / ${row.regs.length}</strong></span>`;
}

function renderPopupRows(row) {
  const tHist = row.historico || 0;
  const sorted = [...row.regs].sort((a, b) => {
    const col = popupSort.col;
    let va, vb;
    if (col === "fecha") {
      va = a.Fecha || ""; vb = b.Fecha || "";
      return popupSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    } else if (col === "operario") {
      const la = String(a.Legajo || "").trim(), lb = String(b.Legajo || "").trim();
      va = empleadosMap[la] || la; vb = empleadosMap[lb] || lb;
      return popupSort.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    } else if (col === "uni") {
      va = Number(a.Uni || 0); vb = Number(b.Uni || 0);
    } else if (col === "seg") {
      va = Number(a.Segundos_Trabajados || 0); vb = Number(b.Segundos_Trabajados || 0);
    } else if (col === "toma") {
      va = Number(a.Tiempo_Toma || 0); vb = Number(b.Tiempo_Toma || 0);
    } else if (col === "ptje") {
      va = Number(a.Premio || 0); vb = Number(b.Premio || 0);
    } else {
      // distHist (default)
      const ta = a.Tiempo_Toma != null ? Number(a.Tiempo_Toma) : 0;
      const tb = b.Tiempo_Toma != null ? Number(b.Tiempo_Toma) : 0;
      va = Math.abs(ta - tHist); vb = Math.abs(tb - tHist);
    }
    return popupSort.asc ? va - vb : vb - va;
  });

  popupBody.innerHTML = sorted.map(r => {
    const anulado = !!r.Anular_Tiempo;
    const trClass = anulado ? ' class="anulado"' : '';
    const uni = Number(r.Uni || 1) || 1;
    const seg = Number(r.Segundos_Trabajados || 0);
    const segUni = r.Tiempo_Toma != null ? Number(r.Tiempo_Toma).toFixed(1) : (uni > 0 ? (seg / uni).toFixed(1) : "0.0");
    const legajo = String(r.Legajo || "").trim();
    const operario = empleadosMap[legajo] || legajo;
    const eyeClass = anulado ? "inactive" : "active";
    const eyeIcon = anulado ? "&#128065;&#xFE0F;&#8203;&#10060;" : "&#128065;&#xFE0F;";
    let fecha = "-";
    if (r.Fecha) {
      const d = new Date(r.Fecha);
      if (!isNaN(d)) {
        const dd = String(d.getDate()).padStart(2, "0");
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const yy = String(d.getFullYear()).slice(-2);
        fecha = dd + "-" + mm + "-" + yy;
      } else { fecha = r.Fecha; }
    }

    return `<tr${trClass}>
      <td>${fecha}</td>
      <td>${operario}</td>
      <td class="num">${uni}</td>
      <td class="num">${seg}</td>
      <td class="num">${segUni}</td>
      <td class="num">${(() => { const p = Number(r.Premio || 0); if (!p) return "-"; const c = p > 0 ? "diff-pos" : "diff-neg"; const s = p > 0 ? "+" : ""; return '<span class="' + c + '">' + s + p.toFixed(2) + '</span>'; })()}</td>
      <td><button class="eye-btn ${eyeClass}" data-id="${r.id}" data-mat="${row.numStr}" title="${anulado ? "Reactivar" : "Anular"} tiempo">${anulado ? "&#128683;" : "&#9989;"}</button></td>
    </tr>`;
  }).join("");
}

document.querySelector(".popup-table thead").addEventListener("click", e => {
  const th = e.target.closest("th[data-pcol]");
  if (!th) return;
  const col = th.dataset.pcol;
  if (popupSort.col === col) {
    popupSort.asc = !popupSort.asc;

    popupSort = { col, asc: col === "fecha" || col === "operario" };
  }
  updatePopupArrows();
  if (currentPopupRow) renderPopupRows(currentPopupRow);
});

function updatePopupArrows() {
  document.querySelectorAll(".popup-table thead th[data-pcol]").forEach(th => {
    const arrow = th.querySelector(".ps-arrow");
    if (!arrow) return;
    if (th.dataset.pcol === popupSort.col) {
      arrow.textContent = popupSort.asc ? "▲" : "▼";
      arrow.style.color = "#111";
    } else {
      arrow.textContent = "▲";
      arrow.style.color = "#94a3b8";
    }
  });
}

popupBody.addEventListener("click", async e => {
  const btn = e.target.closest(".eye-btn");
  if (!btn) return;
  const id = btn.dataset.id;
  const matStr = btn.dataset.mat;
  const reg = registros.find(r => String(r.id) === id);
  if (!reg) return;

  btn.disabled = true;

  const { data: newVal, error } = await sb.rpc("toggle_anular_tiempo", { row_id: Number(id) });

  if (error) {
    alert("Error al actualizar: " + error.message);
    btn.disabled = false;
    return;
  }

  if (newVal === null) {
    alert("No se encontró el registro en la base de datos");
    btn.disabled = false;
    return;
  }

  // Update local state
  reg.Anular_Tiempo = newVal;

  // Recompute this matrix's stats
  computeMatData();
  renderTable();

  // Re-render popup
  const row = matData.find(r => r.numStr === matStr);
  if (row) {
    updatePopupStats(row);
    renderPopupRows(row);
  }
});

/* ===== CLOSE POPUP ===== */
document.getElementById("closePopup").addEventListener("click", () => {
  overlay.classList.remove("visible");
});
overlay.addEventListener("click", e => {
  if (e.target === overlay) overlay.classList.remove("visible");
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") overlay.classList.remove("visible");
});

/* ===== TOAST ===== */
function toastMsg(msg, ms = 3500) {
  const t = document.getElementById("toastT");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

/* ===== EDICION INLINE T.HIST ===== */
tbody.addEventListener("click", e => {
  const td = e.target.closest(".editable-hist");
  if (!td || td.querySelector(".edit-input-hist")) return;

  const matId = Number(td.dataset.matid);
  const nMat = td.dataset.nmat;
  const row = matData.find(r => r.numStr === nMat);
  if (!row) return;

  const oldVal = row.historico > 0 ? row.historico : "";
  const originalHTML = td.innerHTML;

  const input = document.createElement("input");
  input.type = "number";
  input.className = "edit-input-hist";
  input.value = oldVal;
  input.step = "any";
  input.min = "0";

  td.textContent = "";
  td.appendChild(input);
  input.focus();
  input.select();

  function cancelEdit() {
    td.innerHTML = originalHTML;
  }

  async function saveEdit() {
    const newVal = input.value.trim();
    const tiempo = newVal !== "" ? parseFloat(newVal) : null;

    if (tiempo !== null && isNaN(tiempo)) { cancelEdit(); return; }
    if (tiempo !== null && tiempo < 0) { cancelEdit(); return; }

    // Si no cambio, cancelar
    const oldTiempo = row.historico > 0 ? row.historico : null;
    if (tiempo === oldTiempo || (tiempo !== null && oldTiempo !== null && Math.abs(tiempo - oldTiempo) < 0.001)) {
      cancelEdit();
      return;
    }

    input.disabled = true;

    // Guardar en Matrices
    const { error } = await sb.from("Matrices").update({
      Tiempo_Historico: tiempo
    }).eq("id", matId);

    if (error) {
      toastMsg("Error al guardar: " + error.message);
      cancelEdit();
      return;
    }

    // Recalcular registros de produccion (incluso si tiempo es 0/null para limpiar puntajes viejos)
    const { data: updated, error: errRpc } = await sb.rpc("recalcular_matriz", {
      p_matriz: nMat,
      p_nuevo_tiempo: tiempo || 0
    });
    if (errRpc) {
      toastMsg("Guardado, pero error recalculando: " + errRpc.message);
    } else {
      toastMsg("Tiempo guardado — " + (updated || 0) + " registros recalculados");
    }

    // Actualizar el objeto local de matrices
    const mat = matrices.find(m => m.id === matId);
    if (mat) mat.Tiempo_Historico = tiempo;

    // Recomputar y re-renderizar
    computeMatData();
    renderTable();
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); saveEdit(); }
    if (e.key === "Escape") { e.preventDefault(); cancelEdit(); }
  });

  input.addEventListener("blur", () => {
    // Pequeño delay para permitir que Enter se procese primero
    setTimeout(() => {
      if (document.activeElement !== input && td.contains(input)) {
        cancelEdit();
      }
    }, 150);
  });
});
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gestión Productiva — Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 16px;
      display: inline-flex;
      align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .logo-icon svg { width: 32px; height: 32px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }
    .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="password"] {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 16px; font-family: inherit; color: #0f172a;
      background: #f8fafc; outline: none; letter-spacing: 3px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus { border-color: #334155; box-shadow: 0 0 0 3px rgba(51,65,85,0.1); background: white; }
    input[type="password"].error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
    .error-msg { display: none; color: #ef4444; font-size: 13px; font-weight: 500; margin-top: 8px; }
    .error-msg.visible { display: block; }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s; margin-top: 8px;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.99); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .version { text-align: center; font-size: 11px; color: #64748b; margin-top: -20px; margin-bottom: 20px; letter-spacing: 0.5px; font-family: 'Consolas', monospace; }
    .version b { color: #0f172a; }
    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <h1>Gestión Productiva</h1>
      <div class="subtitle">Ingresá la contraseña para continuar</div>
    </div>
    <div class="version">Versión <b id="version-txt">1.4</b></div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <div class="error-msg" id="error-msg">Contraseña incorrecta. Intentá de nuevo.</div>
    </div>
    <button id="btn-login" onclick="handleLogin()">
      <span id="btn-text">Ingresar</span>
      <div class="spinner" id="spinner"></div>
    </button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Rompe caché: cada reload fuerza recarga del HTML desde red al usar meta no-cache.
    // La version de arriba se actualiza en cada deploy.
  </script>
  <script>
    const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem("gp_auth") === "ok") window.location.href = "Inicio/";

    const input = document.getElementById("password");
    input.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
    input.addEventListener("input", () => {
      input.classList.remove("error");
      document.getElementById("error-msg").classList.remove("visible");
    });

    async function handleLogin() {
      const password = input.value.trim();
      if (!password) { input.focus(); return; }
      const btn = document.getElementById("btn-login");
      const btnText = document.getElementById("btn-text");
      const spinner = document.getElementById("spinner");
      btn.disabled = true; btnText.style.display = "none"; spinner.style.display = "block";
      try {
        // RPC server-side: la tabla app_login ya NO permite SELECT con anon. Validacion via funcion con SECURITY DEFINER.
        const { data, error } = await sb.rpc("check_app_password", { p_password: password });
        if (error || data !== true) {
          input.classList.add("error");
          document.getElementById("error-msg").classList.add("visible");
          input.value = ""; input.focus();
        } else {
          sessionStorage.setItem("gp_auth", "ok");
          window.location.href = "Inicio/";
        }
      } catch(err) {
        document.getElementById("error-msg").textContent = "Error de conexión. Intentá de nuevo.";
        document.getElementById("error-msg").classList.add("visible");
      } finally {
        btn.disabled = false; btnText.style.display = "block"; spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>

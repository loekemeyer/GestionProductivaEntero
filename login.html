<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gestión Productiva — Ingresar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 16px;
      display: inline-flex;
      align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .logo-icon svg { width: 32px; height: 32px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 22px; font-weight: 800; color: #0f172a; text-transform: uppercase; letter-spacing: 0.5px; }
    .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; }
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="password"] {
      width: 100%; padding: 14px 16px;
      border: 2px solid #e2e8f0; border-radius: 12px;
      font-size: 16px; font-family: inherit; color: #0f172a;
      background: #f8fafc; outline: none; letter-spacing: 3px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus { border-color: #334155; box-shadow: 0 0 0 3px rgba(51,65,85,0.1); background: white; }
    input[type="password"].error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
    .error-msg { display: none; color: #ef4444; font-size: 13px; font-weight: 500; margin-top: 8px; }
    .error-msg.visible { display: block; }
    button {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #1e293b, #334155);
      color: white; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s; margin-top: 8px;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.99); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .version { text-align: center; font-size: 11px; color: #64748b; margin-top: -20px; margin-bottom: 20px; letter-spacing: 0.5px; font-family: 'Consolas', monospace; }
    .version b { color: #0f172a; }
    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .biometric-section { display: none; text-align: center; margin-bottom: 24px; }
    .biometric-section.visible { display: block; }
    .btn-biometric {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: inherit;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s; margin-bottom: 12px;
    }
    .btn-biometric:hover { opacity: 0.9; }
    .btn-biometric:active { transform: scale(0.99); }
    .btn-biometric:disabled { opacity: 0.6; cursor: not-allowed; }
    .divider { text-align: center; margin: 16px 0; position: relative; }
    .divider span { background: rgba(255,255,255,0.97); padding: 0 8px; font-size: 12px; color: #94a3b8; position: relative; z-index: 1; }
    .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e2e8f0; }
    .password-section { display: block; }
    .password-section.hidden { display: none; }
    .error-msg { display: none; color: #ef4444; font-size: 13px; font-weight: 500; margin-top: 8px; }
    .error-msg.visible { display: block; }
    .biometric-error { color: #f59e0b; font-size: 13px; margin-top: 8px; display: none; }
    .biometric-error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <h1>Gestión Productiva</h1>
      <div class="subtitle">Ingresá la contraseña para continuar</div>
    </div>
    <div class="version">Versión <b id="version-txt">1.9</b></div>
    <div class="biometric-section" id="biometric-section">
      <button id="btn-biometric" class="btn-biometric">
        <span id="btn-bio-text">🔐 Usar Face ID / Huella</span>
        <div class="spinner" id="spinner-bio"></div>
      </button>
      <div class="biometric-error" id="biometric-error"></div>
      <div class="divider" id="divider">
        <span>o</span>
      </div>
    </div>
    <div class="password-section" id="password-section">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <div class="error-msg" id="error-msg">Contraseña incorrecta. Intentá de nuevo.</div>
      </div>
      <button id="btn-login" onclick="handleLogin()">
        <span id="btn-text">Ingresar</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Rompe caché: cada reload fuerza recarga del HTML desde red al usar meta no-cache.
    // La version de arriba se actualiza en cada deploy.
  </script>
  <script>
    const SUPABASE_URL = "https://hrxfctzncixxqmpfhskv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    if (sessionStorage.getItem("gp_auth") === "ok") window.location.href = "Inicio/index.html";

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    const bioSection = document.getElementById("biometric-section");
    const btnBiometric = document.getElementById("btn-biometric");
    const bioError = document.getElementById("biometric-error");
    const input = document.getElementById("password");
    const passwordSection = document.getElementById("password-section");

    // Inicializar UI segun dispositivo
    if (isMobile && window.PublicKeyCredential !== undefined) {
      const biometriaHabilitada = localStorage.getItem("gp_biometria_habilitada");
      if (biometriaHabilitada === "true") {
        bioSection.classList.add("visible");
        btnBiometric.addEventListener("click", handleBiometric);
      }
    }

    input.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
    input.addEventListener("input", () => {
      input.classList.remove("error");
      document.getElementById("error-msg").classList.remove("visible");
    });

    async function handleBiometric() {
      const btnText = document.getElementById("btn-bio-text");
      const spinner = document.getElementById("spinner-bio");
      btnBiometric.disabled = true;
      btnText.style.display = "none";
      spinner.style.display = "block";
      bioError.classList.remove("visible");

      try {
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: new Uint8Array(32),
            timeout: 60000,
            userVerification: "preferred"
          }
        });

        if (credential) {
          // Biometria exitosa
          await handlePasswordlessLogin();
        }
      } catch (err) {
        bioError.textContent = err.name === "NotAllowedError" ? "Autenticación cancelada." : "Error de biometría. Intentá de nuevo.";
        bioError.classList.add("visible");
      } finally {
        btnBiometric.disabled = false;
        btnText.style.display = "block";
        spinner.style.display = "none";
      }
    }

    async function handlePasswordlessLogin() {
      try {
        const { data, error } = await sb.rpc("check_app_password", { p_password: "1515" });
        if (error || data !== true) {
          bioError.textContent = "Error al iniciar sesión. Intentá con contraseña.";
          bioError.classList.add("visible");
        } else {
          sessionStorage.setItem("gp_auth", "ok");
          window.location.href = "Inicio/index.html";
        }
      } catch (err) {
        bioError.textContent = "Error de conexión.";
        bioError.classList.add("visible");
      }
    }

    async function handleLogin() {
      const password = input.value.trim();
      if (!password) { input.focus(); return; }
      const btn = document.getElementById("btn-login");
      const btnText = document.getElementById("btn-text");
      const spinner = document.getElementById("spinner");
      btn.disabled = true; btnText.style.display = "none"; spinner.style.display = "block";
      try {
        const { data, error } = await sb.rpc("check_app_password", { p_password: password });
        if (error || data !== true) {
          input.classList.add("error");
          document.getElementById("error-msg").classList.add("visible");
          input.value = ""; input.focus();
        } else {
          // Login exitoso
          if (isMobile && window.PublicKeyCredential !== undefined && localStorage.getItem("gp_biometria_habilitada") !== "true") {
            if (confirm("¿Habilitar Face ID / Huella para próximas veces?")) {
              localStorage.setItem("gp_biometria_habilitada", "true");
            }
          }
          sessionStorage.setItem("gp_auth", "ok");
          window.location.href = "Inicio/index.html";
        }
      } catch(err) {
        document.getElementById("error-msg").textContent = "Error de conexión. Intentá de nuevo.";
        document.getElementById("error-msg").classList.add("visible");
      } finally {
        btn.disabled = false; btnText.style.display = "block"; spinner.style.display = "none";
      }
    }
  </script>
</body>
</html>

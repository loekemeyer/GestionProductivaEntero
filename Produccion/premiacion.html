<!doctype html>
<html lang="es">
<head>
  <script src="../auth-guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiempos Premiacion</title>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=Inter:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #05070a; color: #ffb000; overflow: hidden;
    }

    /* ---- Tablero a pantalla completa (TV) ---- */
    .board {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      background: linear-gradient(180deg, #0b0d0f 0%, #070809 100%);
      padding: 2.4vh 2.6vw;           /* safe-area para overscan de TV */
    }
    /* grilla de LEDs (huecos oscuros entre puntos) */
    .board::after {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:5;
      background-image: radial-gradient(circle, transparent 46%, #05070a 48%);
      background-size: 5px 5px; mix-blend-mode: multiply; opacity:.85;
    }
    /* scanline + vignette */
    .board::before {
      content:""; position:absolute; inset:0; pointer-events:none; z-index:4;
      background:
        repeating-linear-gradient(0deg, transparent 0 3px, #0003 3px 4px),
        radial-gradient(120% 80% at 50% 40%, transparent 55%, #000a 100%);
    }

    .head {
      position: relative; z-index: 6;
      display: flex; align-items: baseline; gap: 2vw;
      padding-bottom: 1.4vh; margin-bottom: .6vh;
      border-bottom: 3px solid #3a2a08;
    }
    .head h1 {
      flex: 1; text-align: center;
      font-family: 'Silkscreen', monospace; font-weight: 700; letter-spacing: .1em;
      font-size: clamp(26px, 3.4vw, 58px); color: #ffb000;
      text-shadow: 0 0 10px #ff9d00, 0 0 26px #ff6a0066;
    }
    .head .clock, .head .back {
      font-family: 'VT323', monospace; font-size: clamp(18px, 1.6vw, 30px);
      color: #8a6a1e; white-space: nowrap; text-decoration: none;
    }
    .head .back { color:#5a4412; }
    .head .clock b { color:#c79236; }

    .rows {
      position: relative; z-index: 6;
      flex: 1; display: flex; flex-direction: column; min-height: 0;
    }
    .row {
      flex: 1;                         /* reparten el alto -> sin huecos vacios */
      display: grid; grid-template-columns: auto 1fr auto; align-items: center;
      gap: 2vw; padding: 0 1vw;
      border-bottom: 1px solid #1c1405;
    }
    .row:last-child { border-bottom: none; }

    .rank {
      font-family:'VT323', monospace; text-align:center; line-height:1;
      font-size: clamp(46px, 6.4vh, 120px); color:#5a4412; min-width: 1.4em;
    }
    .row:nth-child(1) .rank { color:#ffb000; text-shadow:0 0 14px #ff9d00; }

    .who { min-width: 0; }
    .who .name {
      font-family:'Silkscreen', monospace; letter-spacing:.03em; text-transform: uppercase;
      font-size: clamp(20px, 2.3vw, 42px); color:#ffc23e; text-shadow:0 0 8px #ff9d0055;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .who .meta {
      margin-top: .5vh; font-family:'VT323',monospace; text-transform: uppercase;
      font-size: clamp(19px, 2vw, 36px); color:#c79236; line-height:1.05;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .who .meta b { color:#ffb000; }
    .who .meta .st { color:#8fe07a; }
    .who .meta .st.tm { color:#ffd24a; }

    .stats {
      margin-top: .7vh; display:flex; gap: 1.8vw; flex-wrap: wrap;
      font-family:'VT323',monospace; font-size: clamp(19px, 1.9vw, 34px);
    }
    .stats .k { color:#6d5217; }
    .stats .v { color:#c79236; }
    .stats .v.bien { color:#8fe07a; text-shadow:0 0 8px #4bd06055; }
    .stats .v.mal  { color:#ff6a5a; text-shadow:0 0 8px #ff3b2555; }
    .stats .f { color:#5a4412; font-size:.8em; }
    .stats .dash { color:#4a3a12; }

    /* CONTADOR HERO */
    .counter { text-align:right; min-width: 3.2em; }
    .counter .big {
      font-family:'VT323', monospace; line-height:.8;
      font-size: clamp(80px, 13vh, 200px); color:#ffb000;
      text-shadow: 0 0 12px #ff9d00, 0 0 34px #ff6a0066;
    }
    .counter .lbl {
      font-family:'Silkscreen',monospace; letter-spacing:.16em; color:#8a6a1e;
      font-size: clamp(9px, .85vw, 15px); margin-top: .6vh;
    }

    .msg {
      position: relative; z-index: 6; flex: 1;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-family:'Silkscreen',monospace; font-size: clamp(20px, 2.4vw, 44px);
      color:#8a6a1e; padding: 4vh;
    }
    .msg.err { color:#ff6a5a; }
  </style>
</head>
<body>
  <div class="board">
    <div class="head">
      <a class="back" href="../Inicio/index.html">◄ VOLVER</a>
      <h1>TIEMPOS PREMIACION</h1>
      <span class="clock" id="clock">EN VIVO</span>
    </div>
    <div class="rows" id="rows">
      <div class="msg">CARGANDO...</div>
    </div>
  </div>

  <script src="../version.js"></script>
  <script>
  (function() {
    'use strict';
    const SUPABASE_URL = 'https://hrxfctzncixxqmpfhskv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyeGZjdHpuY2l4eHFtcGZoc2t2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjQyNjEsImV4cCI6MjA4ODMwMDI2MX0.4L6wguch8UZGhC2VpzrWcCjJGUV-IkYsl9JoCWrOLUs';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // opciones que NO son tiempo muerto (igual criterio que monitor.html)
    const NON_DOWNTIME = new Set(['E', 'C', 'PC', 'FJ', 'LT']);

    let matricesMap = {};      // N_Matriz -> Nombre
    let matrizTHist = {};      // N_Matriz -> Tiempo_Historico

    function esc(v) { return v == null ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function fmtToma(v) {
      if (v == null || !isFinite(v)) return null;
      return Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function fechaCorta(iso) {
      if (!iso) return '';
      const p = iso.split('-');
      return p.length === 3 ? (p[2] + '/' + p[1]) : iso;
    }
    // minutos enteros que el operario lleva en el cajon en curso
    function minutosEnCajon(iso) {
      if (!iso) return null;
      const t = new Date(iso).getTime();
      if (isNaN(t)) return null;
      return Math.max(0, Math.floor((Date.now() - t) / 60000));
    }
    function fmtCounter(iso) {
      const m = minutosEnCajon(iso);
      return m == null ? '--' : String(m).padStart(2, '0');
    }
    function updateTimers() {
      document.querySelectorAll('.big[data-inicio]').forEach(el => {
        el.textContent = fmtCounter(el.getAttribute('data-inicio'));
      });
    }

    function claseToma(valor, tHist) {
      if (valor == null || !isFinite(valor) || !tHist || tHist <= 0) return '';
      return valor <= tHist ? 'bien' : 'mal';
    }
    function stat(kLabel, valor, tHist, fechaISO) {
      const txt = fmtToma(valor);
      const f = fechaISO ? ' <span class="f">' + fechaCorta(fechaISO) + '</span>' : '';
      const v = txt == null
        ? '<span class="dash">—</span>'
        : '<span class="v ' + claseToma(valor, tHist) + '">' + txt + '</span>' + f;
      return '<span><span class="k">' + kLabel + '</span> ' + v + '</span>';
    }

    function operariosActivos(empleados, regs) {
      const porLeg = {};
      regs.forEach(r => {
        const leg = String(r.legajo).trim();
        (porLeg[leg] = porLeg[leg] || []).push(r);
      });
      const activos = new Map();

      empleados.forEach(emp => {
        const leg = String(emp.Legajo).trim();
        if (leg === '1') return; // ficha de pruebas
        if (String(emp.Sede || '').trim().toUpperCase() !== 'C') return;
        const empRegs = porLeg[leg];
        if (!empRegs || empRegs.length === 0) return;

        let currentMatriz = null;
        let pendingTM = null;
        let lastAction = null;
        let fjEvent = null;
        let cajonInicioTs = null; // ts_event de la ultima E o C = arranque del cajon en curso

        empRegs.forEach(r => {
          const op = r.opcion;
          if (op === 'LT') return;
          if (op === 'FJ') { fjEvent = r; pendingTM = null; return; }
          if (op === 'E') {
            currentMatriz = r.texto || r.matriz || null;
            lastAction = r; pendingTM = null; cajonInicioTs = r.ts_event;
          } else if (op === 'C') {
            lastAction = { ...r, opcion: 'C' }; pendingTM = null; cajonInicioTs = r.ts_event;
          } else if (!NON_DOWNTIME.has(op)) {
            if (pendingTM && pendingTM.opcion === op) pendingTM = null;
            else if (!pendingTM) pendingTM = r;
          } else {
            lastAction = r;
          }
        });

        if (fjEvent) return;
        if (!currentMatriz) return;
        if (!lastAction && !pendingTM) return;

        const matNum = String(currentMatriz).trim();
        if (!matNum) return;
        activos.set(leg, {
          legajo: leg,
          nombre: emp.Empleado,
          matriz: matNum,
          estado: pendingTM ? 'tm' : 'prod',
          cajonInicio: cajonInicioTs
        });
      });

      return activos;
    }

    async function refresh() {
      const rows = document.getElementById('rows');
      try {
        const hoyISO = new Date().toISOString().slice(0, 10);

        const [empRes, matRes, regRes] = await Promise.all([
          sb.from('Empleados').select('Legajo, Empleado, Activo, Sede').eq('Activo', 'SI'),
          sb.from('Matrices').select('N_Matriz, Matriz, Tiempo_Historico'),
          sb.from('Registros Produccion Cervantes')
            .select('legajo, opcion, ts_event, matriz, texto')
            .gte('ts_event', hoyISO + 'T00:00:00')
            .lte('ts_event', hoyISO + 'T23:59:59')
            .order('ts_event', { ascending: true })
        ]);

        matricesMap = {}; matrizTHist = {};
        (matRes.data || []).forEach(m => {
          const k = String(m.N_Matriz).trim();
          matricesMap[k] = m.Matriz;
          matrizTHist[k] = Number(m.Tiempo_Historico) || 0;
        });

        const activos = operariosActivos(empRes.data || [], regRes.data || []);
        const legajos = [...activos.keys()];

        if (legajos.length === 0) {
          rows.innerHTML = '<div class="msg">SIN OPERARIOS EN PRODUCCION</div>';
          marcarActualizado();
          return;
        }

        const desde = new Date(); desde.setDate(desde.getDate() - 45);
        const desdeISO = desde.toISOString().slice(0, 10);
        const { data: cajones, error: cajErr } = await sb.from('db_n8n_espejo')
          .select('Legajo, Matriz, Tiempo_Toma, Hora_Fin, Fecha, Uni, Eliminar')
          .in('Legajo', legajos)
          .gte('Fecha', desdeISO + 'T00:00:00');
        if (cajErr) throw cajErr;

        const grupo = {};
        (cajones || []).forEach(c => {
          if (c.Eliminar === 'S') return;
          if (!(Number(c.Uni) > 0)) return;
          const toma = Number(c.Tiempo_Toma);
          if (!(toma > 0)) return;
          const leg = String(c.Legajo).trim();
          const mat = c.Matriz ? String(c.Matriz).trim() : null;
          if (!mat) return;
          const key = leg + '|' + mat;
          const fecha = c.Fecha ? String(c.Fecha).slice(0, 10) : '';
          (grupo[key] = grupo[key] || []).push({ fecha, horaFin: c.Hora_Fin || '', toma });
        });

        const ayerD = new Date(hoyISO + 'T12:00:00');
        ayerD.setDate(ayerD.getDate() - 1);
        const ayerISO = ayerD.toISOString().slice(0, 10);

        const filas = legajos.map(leg => {
          const a = activos.get(leg);
          const key = leg + '|' + a.matriz;
          const rowsG = grupo[key] || [];

          let ultimo = null;
          rowsG.forEach(r => {
            if (!ultimo) { ultimo = r; return; }
            if ((r.fecha + '|' + r.horaFin) > (ultimo.fecha + '|' + ultimo.horaFin)) ultimo = r;
          });

          const porDia = {};
          rowsG.forEach(r => {
            const d = porDia[r.fecha] = porDia[r.fecha] || { sum: 0, n: 0 };
            d.sum += r.toma; d.n += 1;
          });
          const promHoy = porDia[hoyISO] ? porDia[hoyISO].sum / porDia[hoyISO].n : null;
          const promAnt = porDia[ayerISO] ? porDia[ayerISO].sum / porDia[ayerISO].n : null;

          const tHist = matrizTHist[a.matriz] || 0;
          return {
            legajo: leg, nombre: a.nombre, estado: a.estado,
            matriz: a.matriz, matrizNombre: matricesMap[a.matriz] || '',
            cajonInicio: a.cajonInicio,
            ultimo: ultimo ? ultimo.toma : null,
            promHoy, promAnt, ayerFecha: promAnt != null ? ayerISO : null, tHist
          };
        });

        // Ranking: mejor toma de hoy primero (menor = mejor); sin dato de hoy, al final.
        filas.sort((x, y) => {
          const hx = x.promHoy == null ? Infinity : x.promHoy;
          const hy = y.promHoy == null ? Infinity : y.promHoy;
          if (hx !== hy) return hx - hy;
          const ux = x.ultimo == null ? Infinity : x.ultimo;
          const uy = y.ultimo == null ? Infinity : y.ultimo;
          if (ux !== uy) return ux - uy;
          return parseInt(x.legajo.replace(/\D/g, '')) - parseInt(y.legajo.replace(/\D/g, ''));
        });

        render(filas);
        marcarActualizado();
      } catch (e) {
        rows.innerHTML = '<div class="msg err">ERROR: ' + esc(e.message || e) + '</div>';
      }
    }

    function render(filas) {
      const rows = document.getElementById('rows');
      rows.innerHTML = filas.map((f, i) => {
        const est = f.estado === 'tm'
          ? '<span class="st tm">TIEMPO MUERTO</span>'
          : '<span class="st">PRODUCIENDO</span>';
        const counter = f.cajonInicio
          ? '<span class="big" data-inicio="' + esc(f.cajonInicio) + '">' + fmtCounter(f.cajonInicio) + '</span>'
          : '<span class="big">--</span>';
        return '<div class="row">' +
          '<div class="rank">' + (i + 1) + '</div>' +
          '<div class="who">' +
            '<div class="name">' + esc(f.nombre) + '</div>' +
            '<div class="meta"><b>M' + esc(f.matriz) + '</b> ' + esc(f.matrizNombre) + ' · ' + est + '</div>' +
            '<div class="stats">' +
              stat('ULT', f.ultimo, f.tHist) +
              stat('HOY', f.promHoy, f.tHist) +
              stat('AYER', f.promAnt, f.tHist, f.ayerFecha) +
              stat('HIST', f.tHist > 0 ? f.tHist : null, 0) +
            '</div>' +
          '</div>' +
          '<div class="counter">' + counter + '<div class="lbl">MIN EN CAJON</div></div>' +
        '</div>';
      }).join('');
    }

    function marcarActualizado() {
      document.getElementById('clock').innerHTML =
        'EN VIVO · <b>' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + '</b>';
    }

    refresh();
    setInterval(refresh, 30000);      // auto-refresh datos cada 30s
    setInterval(updateTimers, 15000); // cronometro "En cajón" cada 15s
  })();
  </script>
</body>
</html>
